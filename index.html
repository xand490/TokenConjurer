<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Token Conjurer">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
  <title>Token Conjurer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 16px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #333;
    }

    h1 {
      font-size: 24px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bt-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      background: #333;
      color: white;
      transition: all 0.3s;
      font-size: 14px;
    }

    .bt-btn.connected { background: #10b981; }
    .bt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .search-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .search-buttons { display: flex; gap: 8px; }

    .search-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #1a1a2e;
      color: white;
      font-size: 16px;
    }

    .search-btn {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #8b5cf6;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .search-btn.token { background: #ec4899; }
    .search-btn:hover { opacity: 0.9; }
    .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 12px 4px;
      border: 2px solid #333;
      border-radius: 10px;
      background: #1a1a2e;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab:hover { border-color: #555; color: #ccc; }
    .tab.active { border-color: #8b5cf6; color: #fff; background: rgba(139, 92, 246, 0.15); }
    .tab .tab-count {
      display: block;
      font-size: 11px;
      color: #555;
      margin-top: 2px;
      font-weight: 400;
    }
    .tab.active .tab-count { color: #a78bfa; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card-item {
      background: #1a1a2e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 12px;
      transition: all 0.3s;
      margin-bottom: 12px;
    }

    .card-item:hover { border-color: #8b5cf6; }

    .card-main {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-thumb {
      width: 60px;
      height: 84px;
      border-radius: 6px;
      object-fit: cover;
    }

    .card-info { flex: 1; min-width: 0; }

    .card-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
      word-wrap: break-word;
    }

    .card-set { font-size: 12px; color: #888; }

    .preferred-badge {
      display: inline-block;
      background: #10b981;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .version-toggle {
      color: #8b5cf6;
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 8px;
      display: inline-block;
    }

    .version-toggle:hover { color: #a78bfa; }

    .version-selector {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #333;
    }

    .version-selector.open { display: flex; }

    .version-btn {
      padding: 6px 12px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #2a2a3e;
      color: white;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .version-btn:hover { border-color: #8b5cf6; background: #3a3a4e; }
    .version-btn.selected { border-color: #8b5cf6; background: #8b5cf6; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .send-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #8b5cf6;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .send-btn:hover { background: #7c3aed; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .fav-btn {
      padding: 10px 14px;
      border: 2px solid #333;
      border-radius: 6px;
      background: none;
      color: #666;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1;
    }

    .fav-btn:hover { border-color: #f59e0b; color: #f59e0b; }
    .fav-btn.favourited { border-color: #f59e0b; color: #f59e0b; background: rgba(245, 158, 11, 0.1); }

    .deck-add-btn {
      padding: 10px 14px;
      border: 2px solid #333;
      border-radius: 6px;
      background: none;
      color: #666;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1;
    }

    .deck-add-btn:hover { border-color: #10b981; color: #10b981; }

    .remove-btn {
      padding: 10px 14px;
      border: 2px solid #333;
      border-radius: 6px;
      background: none;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .remove-btn:hover { border-color: #ef4444; color: #ef4444; }

    .loading { text-align: center; padding: 40px; color: #888; }

    .spinner {
      border: 3px solid #333;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      background: #1a1a2e;
      border: 2px solid #333;
      position: relative;
      overflow: hidden;
    }

    .status::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: var(--progress-width, 0%);
      background: rgba(16, 185, 129, 0.3);
      transition: width 0.3s ease;
      z-index: 0;
    }

    .status > div { position: relative; z-index: 1; }
    .status-time { font-size: 12px; color: #ffffff; margin-top: 4px; opacity: 0.8; }
    .status.success { border-color: #10b981; color: #10b981; }
    .status.error { border-color: #ef4444; color: #ef4444; }
    .status.info { border-color: #8b5cf6; color: #8b5cf6; }
    #status {
      position: sticky; top: 0; z-index: 500;
      background: #1a1a2e;
      padding: 8px 0;
      /* full-bleed horizontal band: spread the bg to the viewport edges, clip to this strip */
      box-shadow: 0 0 0 100vmax #1a1a2e;
      clip-path: inset(0 -100vmax);
    }
    #status:empty { padding: 0; box-shadow: none; }

    canvas.hidden { display: none; }

    .empty-state { text-align: center; padding: 40px 20px; color: #555; }

    .empty-state-text { font-size: 14px; }
    .recent-time { font-size: 11px; color: #555; margin-top: 2px; }

    .deck-item {
      background: #1a1a2e;
      border: 2px solid #333;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .deck-item:hover { border-color: #444; }

    .deck-header {
      display: flex;
      align-items: center;
      padding: 14px;
      cursor: pointer;
      gap: 12px;
    }

    .deck-header-info { flex: 1; }

    .deck-header-name {
      font-weight: 600;
      font-size: 16px;
    }

    .deck-header-count {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .deck-header-arrow {
      color: #555;
      font-size: 14px;
      transition: transform 0.2s;
    }

    .deck-item.open .deck-header-arrow { transform: rotate(90deg); }
    .deck-item.open { border-color: #8b5cf6; }

    .deck-cards {
      display: none;
      padding: 0 14px 14px;
      border-top: 1px solid #333;
    }

    .deck-item.open .deck-cards { display: block; }

    .deck-card-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a3e;
    }

    .deck-card-row:last-child { border-bottom: none; }

    .deck-card-thumb {
      width: 40px;
      height: 56px;
      border-radius: 4px;
      object-fit: cover;
    }

    .deck-card-info { flex: 1; min-width: 0; }

    .deck-card-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deck-card-set { font-size: 11px; color: #666; }

    .deck-card-actions { display: flex; gap: 6px; }

    .deck-card-send {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      background: #8b5cf6;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .deck-card-send:hover { background: #7c3aed; }

    .deck-card-remove {
      padding: 6px 8px;
      border: 1px solid #444;
      border-radius: 5px;
      background: none;
      color: #666;
      font-size: 12px;
      cursor: pointer;
    }

    .deck-card-remove:hover { border-color: #ef4444; color: #ef4444; }

    .deck-actions {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #2a2a3e;
    }

    .deck-rename-btn, .deck-delete-btn {
      padding: 6px 12px;
      border: 1px solid #444;
      border-radius: 5px;
      background: none;
      color: #888;
      font-size: 12px;
      cursor: pointer;
    }

    .deck-rename-btn:hover { border-color: #8b5cf6; color: #8b5cf6; }
    .deck-delete-btn:hover { border-color: #ef4444; color: #ef4444; }

    .new-deck-btn {
      width: 100%;
      padding: 14px;
      border: 2px dashed #444;
      border-radius: 12px;
      background: none;
      color: #888;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .new-deck-btn:hover { border-color: #10b981; color: #10b981; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #1a1a2e;
      border: 2px solid #8b5cf6;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .modal-deck-btn {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #2a2a3e;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      text-align: left;
      transition: all 0.2s;
    }

    .modal-deck-btn:hover { border-color: #8b5cf6; }

    .modal-deck-count { font-size: 12px; color: #888; margin-left: 8px; }

    .modal-new-deck {
      width: 100%;
      padding: 12px;
      border: 2px dashed #444;
      border-radius: 8px;
      background: none;
      color: #10b981;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .modal-new-deck:hover { border-color: #10b981; }

    .modal-cancel {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #888;
      font-size: 14px;
      cursor: pointer;
      margin-top: 4px;
    }

    .modal-cancel:hover { background: #444; color: #fff; }

    /* HAMBURGER MENU */
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-right { display: flex; align-items: center; gap: 10px; }

    .menu-btn {
      width: 36px;
      height: 36px;
      border: 2px solid #333;
      border-radius: 8px;
      background: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      line-height: 1;
      flex-shrink: 0;
    }

    .menu-btn:hover { border-color: #555; color: #ccc; }
    .menu-btn.open { border-color: #8b5cf6; color: #fff; }

    .format-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      background: rgba(236, 72, 153, 0.15);
      color: #ec4899;
      border: 1px solid rgba(236, 72, 153, 0.3);
      display: none;
      white-space: nowrap;
    }

    .format-badge.visible { display: inline-block; }

    .menu-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
    }

    .menu-overlay.open { display: block; }

    .menu-drawer {
      position: fixed;
      top: 0; left: -280px;
      width: 280px;
      height: 100%;
      background: #1a1a2e;
      border-right: 2px solid #333;
      z-index: 201;
      transition: left 0.3s ease;
      padding: 20px;
      overflow-y: auto;
    }

    .menu-overlay.open .menu-drawer { left: 0; }

    .menu-title {
      font-size: 13px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      margin-top: 20px;
    }

    .menu-title:first-child { margin-top: 0; }

    .menu-option {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #333;
      border-radius: 10px;
      background: #2a2a3e;
      color: #ccc;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-option:hover { border-color: #555; color: #fff; }

    .menu-option.active {
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.12);
      color: #fff;
    }

    .menu-option .menu-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #555;
      flex-shrink: 0;
    }

    .menu-option.active .menu-dot {
      background: #8b5cf6;
      border-color: #8b5cf6;
    }

    .menu-option-label { flex: 1; }

    .menu-option-sub {
      font-size: 11px;
      color: #666;
      display: block;
      margin-top: 2px;
    }

    .menu-option.active .menu-option-sub { color: #a78bfa; }

    .menu-close {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #888;
      font-size: 14px;
      cursor: pointer;
      margin-top: 20px;
    }

    .menu-close:hover { background: #444; color: #fff; }

    /* PLANECHASE GAME PANEL */
    .pc-game-panel {
      background: linear-gradient(135deg, rgba(236,72,153,0.08), rgba(139,92,246,0.08));
      border: 2px solid rgba(236,72,153,0.3);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      display: none;
    }

    .pc-game-panel.visible { display: block; }

    .pc-game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .pc-game-title {
      font-size: 14px;
      font-weight: 700;
      color: #ec4899;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pc-game-stop {
      padding: 5px 12px;
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 6px;
      background: rgba(239,68,68,0.1);
      color: #ef4444;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pc-game-stop:hover { background: rgba(239,68,68,0.2); border-color: #ef4444; }

    .pc-current-plane {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .pc-current-thumb {
      width: 56px;
      height: 78px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .pc-current-info { flex: 1; min-width: 0; }

    .pc-current-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 2px;
      word-wrap: break-word;
    }

    .pc-current-meta {
      font-size: 12px;
      color: #888;
    }

    .pc-position {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    .pc-game-actions {
      display: flex;
      gap: 8px;
    }

    .pc-planeswalk-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pc-planeswalk-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .pc-planeswalk-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .pc-resend-btn {
      padding: 12px 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background: none;
      color: #888;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pc-resend-btn:hover { border-color: #8b5cf6; color: #8b5cf6; }

    /* MOMIR GAME PANEL */
    .momir-panel {
      background: linear-gradient(135deg, rgba(34,197,94,0.08), rgba(56,189,248,0.08));
      border: 2px solid rgba(34,197,94,0.3);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      display: none;
    }

    .momir-panel.visible { display: block; }

    .momir-title {
      font-size: 14px;
      font-weight: 700;
      color: #22c55e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .momir-start-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      color: #06220f;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .momir-hint {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-bottom: 10px;
    }

    .momir-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
    }

    /* generic-mana-symbol style circles */
    .momir-chip {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #333;
      background: rgba(0,0,0,0.3);
      color: #999;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: inset 0 -2px 3px rgba(0,0,0,0.4);
    }

    .momir-chip:hover { border-color: #22c55e; color: #ccc; }

    .momir-chip.selected {
      background: #d8d2c8;
      border-color: #f5f0e6;
      color: #111;
      transform: scale(1.12);
      box-shadow: 0 0 10px rgba(34,197,94,0.6), inset 0 -2px 3px rgba(0,0,0,0.25);
    }

    .momir-summon-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      color: #06220f;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .momir-summon-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .momir-summon-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Planechase start game in decks */
    .deck-play-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .deck-play-btn:hover { opacity: 0.9; }

    /* IMAGE ZOOM OVERLAY */
    .zoom-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
    }

    .zoom-overlay.open { display: flex; }

    .zoom-overlay img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    .card-thumb, .deck-card-thumb, .pc-current-thumb { cursor: pointer; }

    /* Planechase thumbnails: rotate portrait source images to landscape */
    .pc-mode .card-thumb {
      width: 72px;
      height: 100px;
      transform: rotate(90deg);
      margin: -14px 14px;
      object-fit: cover;
      border-radius: 4px;
    }

    .pc-mode .deck-card-thumb {
      width: 52px;
      height: 72px;
      transform: rotate(90deg);
      margin: -10px 10px;
      object-fit: cover;
      border-radius: 3px;
    }

    .pc-mode .pc-current-thumb {
      width: 78px;
      height: 110px;
      transform: rotate(90deg);
      margin: -16px 16px;
      object-fit: cover;
      border-radius: 4px;
    }

    .zoom-overlay.pc-rotate img {
      transform: rotate(90deg);
      max-width: 90vh;
      max-height: 100vw;
    }

    .pw-icon {
      display: inline-block;
      width: 0.75em;
      height: 1em;
      vertical-align: -0.15em;
      background: currentColor;
      -webkit-mask: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 860 1582%27%3E%3Cg transform=%27translate(0,1582) scale(0.1,-0.1)%27%3E%3Cpath d=%27M4282 15353c-29-145-64-577-97-1163-140-2509-268-3722-480-4558-66-260-85-312-109-312-29 0-360-28-422-36l-51-6-21 74c-148 511-267 1435-472 3688-61 675-86 915-96 960-6 24-6 25-14 4-15-38-57-415-135-1186-90-900-131-1277-191-1753-118-943-237-1586-356-1939l-33-97-160-53c-88-30-188-65-222-80-34-14-64-26-67-26-7 0-61 147-95 256-143 466-242 1048-396 2319-63 518-86 684-116 829-21 104-33 132-43 100-49-160-175-1446-321-3274-73-923-84-1065-77-1071 4-3 65-29 137-59 268-110 586-278 845-448 1092-712 1945-1852 2414-3220 264-771 416-1560 511-2657 41-481 54-565 86-565 27 0 45 122 84 570 103 1192 280 2052 598 2895 142 377 359 813 585 1175 483 772 1126 1424 1842 1867 262 162 515 291 780 398 52 21 98 41 102 44 3 3-5 143-18 311-205 2624-348 4092-394 4043-12-12-46-181-69-338-11-77-50-381-86-675-133-1088-214-1586-330-2035-47-181-139-465-151-465-2 0-38 14-81 31-43 17-143 53-223 80l-145 48-18 48c-59 153-150 539-216 918-113 644-204 1385-351 2855-96 963-124 1189-140 1159-12-21-42-316-115-1119-188-2060-307-2990-447-3498l-31-114-51 6c-63 8-393 36-423 36-25 0-40 44-108 315-208 821-334 1987-465 4280-59 1040-95 1454-128 1487-6 6-14-14-20-49z%27/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat;
      mask: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 860 1582%27%3E%3Cg transform=%27translate(0,1582) scale(0.1,-0.1)%27%3E%3Cpath d=%27M4282 15353c-29-145-64-577-97-1163-140-2509-268-3722-480-4558-66-260-85-312-109-312-29 0-360-28-422-36l-51-6-21 74c-148 511-267 1435-472 3688-61 675-86 915-96 960-6 24-6 25-14 4-15-38-57-415-135-1186-90-900-131-1277-191-1753-118-943-237-1586-356-1939l-33-97-160-53c-88-30-188-65-222-80-34-14-64-26-67-26-7 0-61 147-95 256-143 466-242 1048-396 2319-63 518-86 684-116 829-21 104-33 132-43 100-49-160-175-1446-321-3274-73-923-84-1065-77-1071 4-3 65-29 137-59 268-110 586-278 845-448 1092-712 1945-1852 2414-3220 264-771 416-1560 511-2657 41-481 54-565 86-565 27 0 45 122 84 570 103 1192 280 2052 598 2895 142 377 359 813 585 1175 483 772 1126 1424 1842 1867 262 162 515 291 780 398 52 21 98 41 102 44 3 3-5 143-18 311-205 2624-348 4092-394 4043-12-12-46-181-69-338-11-77-50-381-86-675-133-1088-214-1586-330-2035-47-181-139-465-151-465-2 0-38 14-81 31-43 17-143 53-223 80l-145 48-18 48c-59 153-150 539-216 918-113 644-204 1385-351 2855-96 963-124 1189-140 1159-12-21-42-316-115-1119-188-2060-307-2990-447-3498l-31-114-51 6c-63 8-393 36-423 36-25 0-40 44-108 315-208 821-334 1987-465 4280-59 1040-95 1454-128 1487-6 6-14-14-20-49z%27/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <button class="menu-btn" id="menuBtn" title="Format">&#9776;</button>
        <h1>Token Conjurer</h1>
        <span class="format-badge" id="formatBadge">Planechase</span>
      </div>
      <div class="header-right">
        <button class="bt-btn" id="btBtn">Connect BT</button>
      </div>
    </div>

    <div id="status"></div>

    <!-- Planechase Game Panel (shown during active game) -->
    <div class="pc-game-panel" id="pcGamePanel">
      <div class="pc-game-header">
        <div class="pc-game-title"><span class="pw-icon"></span> Planechase</div>
        <button class="pc-game-stop" id="pcStopBtn">End Game</button>
      </div>
      <div class="pc-current-plane" id="pcCurrentPlane">
        <img class="pc-current-thumb" id="pcPlaneThumb" src="" alt="" onclick="zoomCard(this.src)">
        <div class="pc-current-info">
          <div class="pc-current-name" id="pcPlaneName">—</div>
          <div class="pc-current-meta" id="pcPlaneMeta"></div>
          <div class="pc-position" id="pcPosition"></div>
        </div>
      </div>
      <div class="pc-game-actions">
        <button class="pc-planeswalk-btn" id="pcPlaneswalkBtn"><span class="pw-icon"></span> Planeswalk</button>
        <button class="pc-resend-btn" id="pcResendBtn">Resend</button>
      </div>
    </div>

    <!-- Momir Game Panel -->
    <div class="momir-panel" id="momirPanel">
      <div class="pc-game-header">
        <div class="momir-title">&#129516; Momir</div>
        <button class="pc-game-stop" id="momirStopBtn" style="display:none;">End Game</button>
      </div>
      <button class="momir-start-btn" id="momirStartBtn">Start Momir Game</button>
      <div id="momirGame" style="display:none;">
        <div class="momir-hint">Pay X &mdash; pick a mana value, then summon a random creature</div>
        <div class="momir-chips" id="momirChips"></div>
        <button class="momir-summon-btn" id="momirSummonBtn" disabled>&#127922; Summon</button>
        <div class="pc-current-plane" id="momirLastRow" style="display:none; margin-top:12px; margin-bottom:0;">
          <img class="pc-current-thumb" id="momirThumb" src="" alt="" onclick="zoomCard(this.src)">
          <div class="pc-current-info">
            <div class="pc-current-name" id="momirName">&mdash;</div>
            <div class="pc-current-meta" id="momirMeta"></div>
            <div class="pc-position" id="momirCount"></div>
          </div>
          <button class="pc-resend-btn" id="momirResendBtn" style="padding:8px 10px;">Resend</button>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="search">Search</button>
      <button class="tab" data-tab="decks">Decks <span class="tab-count" id="deckCount"></span></button>
      <button class="tab" data-tab="favourites">Favs <span class="tab-count" id="favCount"></span></button>
      <button class="tab" data-tab="recent">Recent <span class="tab-count" id="recentCount"></span></button>
      <button class="tab" data-tab="dock">Dock <span class="tab-count" id="dockCount"></span></button>
    </div>

    <div class="tab-content active" id="tab-search">
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="Search for MTG cards...">
        <div class="search-buttons">
          <button class="search-btn" id="searchBtn">Search Cards</button>
          <button class="search-btn token" id="tokenBtn">Search Tokens</button>
          <button class="search-btn token" id="listAllBtn" style="display:none;">List All</button>
        </div>
      </div>
      <div id="results"></div>
    </div>

    <div class="tab-content" id="tab-decks">
      <div style="background:#16213e; border-radius:10px; padding:12px; margin-bottom:12px;">
        <div id="importInputs">
          <div style="font-size:13px; color:#8b5cf6; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;">Import deck &rarr; tokens &rarr; dock</div>
          <input type="text" id="importUrl" placeholder="Archidekt / Moxfield URL (or paste below)" style="width:100%; padding:9px; border-radius:8px; border:1px solid #333; background:#0f1626; color:#fff; font-size:13px; margin-bottom:6px;">
          <textarea id="importText" placeholder="...or paste a decklist (1 Sol Ring, 4 Lightning Bolt...)" style="width:100%; height:60px; padding:9px; border-radius:8px; border:1px solid #333; background:#0f1626; color:#fff; font-size:13px; margin-bottom:6px;"></textarea>
          <button class="send-btn" onclick="importDeck()" style="width:100%;">Find Tokens</button>
        </div>
        <div id="importStatus" style="font-size:12px; color:#4ade80; min-height:16px; margin-top:6px;"></div>
        <div id="importResults"></div>
      </div>
      <div id="decksList"></div>
    </div>

    <div class="tab-content" id="tab-favourites">
      <div id="favouritesList"></div>
    </div>

    <div class="tab-content" id="tab-dock">
      <div id="dockList"><div class="empty-state"><div class="empty-state-text">Connect Bluetooth, then open this tab<br>to see cards stored on the dock.</div></div></div>
    </div>

    <div class="tab-content" id="tab-recent">
      <div id="recentList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="deckModal">
    <div class="modal">
      <div class="modal-title">Add to Deck</div>
      <div id="deckModalList"></div>
      <button class="modal-new-deck" id="modalNewDeck">+ New Deck</button>
      <button class="modal-cancel" id="modalCancel">Cancel</button>
    </div>
  </div>

  <!-- Format Menu Drawer -->
  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-drawer">
      <div class="menu-title">Game Format</div>
      <button class="menu-option active" data-format="mtg_standard">
        <span class="menu-dot"></span>
        <span class="menu-option-label">MTG<span class="menu-option-sub">Standard card search &amp; decks</span></span>
      </button>
      <button class="menu-option" data-format="mtg_planechase">
        <span class="menu-dot"></span>
        <span class="menu-option-label">MTG — Planechase<span class="menu-option-sub">Build &amp; play Planechase decks</span></span>
      </button>
      <button class="menu-option" data-format="mtg_momir">
        <span class="menu-dot"></span>
        <span class="menu-option-label">MTG — Momir<span class="menu-option-sub">Pay X, summon a random creature</span></span>
      </button>
      <div class="menu-title" style="margin-top:18px;">Display Settings</div>
      <div style="padding:0 4px; font-size:13px;">
        <label style="display:block; margin-bottom:8px;">Mode
          <select id="dsMode" style="width:100%; padding:8px; border-radius:8px; background:#0f1626; color:#fff; border:1px solid #333; margin-top:4px;">
            <option value="fullbleed">Full bleed (fills frame)</option>
            <option value="fill-blur">True size + blur fill</option>
            <option value="fill-mirror">True size + mirror fill</option>
            <option value="fill-black">True size + black fill</option>
            <option value="fill-white">True size + blank (panel white)</option>
            <option value="smart">Smart stretch</option>
            <option value="plain">Plain stretch</option>
          </select>
        </label>
        <label style="display:block; margin-bottom:6px;">Bottom trim <span id="dsBtrimV"></span>%
          <input type="range" id="dsBtrim" min="0" max="12" step="0.5" style="width:100%;">
        </label>
        <label style="display:block; margin-bottom:6px;">Side trim <span id="dsStrimV"></span>%
          <input type="range" id="dsStrim" min="0" max="15" step="0.5" style="width:100%;">
        </label>
        <label style="display:block; margin-bottom:6px;">Gamma <span id="dsGammaV"></span>
          <input type="range" id="dsGamma" min="0.5" max="2.2" step="0.05" style="width:100%;">
        </label>
        <label style="display:block; margin-bottom:6px;">Top trim <span id="dsTtrimV"></span>%
          <input type="range" id="dsTtrim" min="0" max="12" step="0.5" style="width:100%;">
        </label>
        <label style="display:block; margin-bottom:6px;">Brightness <span id="dsBrightV"></span>
          <input type="range" id="dsBright" min="-60" max="60" step="2" style="width:100%;">
        </label>
        <label style="display:block; margin-bottom:6px;">Contrast <span id="dsContrastV"></span>
          <input type="range" id="dsContrast" min="-50" max="50" step="2" style="width:100%;">
        </label>
        <label style="display:block; margin-bottom:8px;">Dither
          <select id="dsDither" style="width:100%; padding:8px; border-radius:8px; background:#0f1626; color:#fff; border:1px solid #333; margin-top:4px;">
            <option value="fs">Floyd-Steinberg</option>
            <option value="none">None (nearest level)</option>
          </select>
        </label>
      </div>
      <div class="menu-title" style="margin-top:18px;">Dock WiFi</div>
      <div style="padding:0 4px 8px;">
        <button id="wifiScanBtn" onclick="dockWifiScan()" style="width:100%; padding:8px; border:none; border-radius:8px; background:#2a2a4a; color:#9db4ff; margin-bottom:6px;">Scan for networks</button>
        <div id="wifiScanList"></div>
        <input type="text" id="wifiSsid" placeholder="Network name (SSID)" style="width:100%; padding:8px; border-radius:8px; background:#0f1626; color:#fff; border:1px solid #333; margin-bottom:6px; font-size:13px;">
        <input type="password" id="wifiPass" placeholder="Password" style="width:100%; padding:8px; border-radius:8px; background:#0f1626; color:#fff; border:1px solid #333; margin-bottom:6px; font-size:13px;">
        <button onclick="dockWifi()" style="width:100%; padding:8px; border:none; border-radius:8px; background:#334; color:#fff;">Send WiFi to dock</button>
        <button onclick="enableFastSync()" id="fastSyncBtn" style="width:100%; padding:8px; border:none; border-radius:8px; background:#2a4a3a; color:#9fe1cb; margin-top:6px;">Enable fast sync (WiFi)</button>
        <div id="fastSyncStatus" style="font-size:11px; color:#889; margin-top:4px; min-height:14px;"></div>
      </div>
      <div class="menu-title" style="margin-top:18px;">Dock Buttons (debug)</div>
      <div style="display:flex; gap:6px; padding:0 4px 8px;">
        <button onclick="dockBtn(1)" style="flex:1; padding:8px; border:none; border-radius:8px; background:#334; color:#fff;">1</button>
        <button onclick="dockBtn(2)" style="flex:1; padding:8px; border:none; border-radius:8px; background:#334; color:#fff;">2</button>
        <button onclick="dockBtn(3)" style="flex:1; padding:8px; border:none; border-radius:8px; background:#334; color:#fff;">3</button>
        <button onclick="dockBtn(4)" style="flex:1; padding:8px; border:none; border-radius:8px; background:#334; color:#fff;">4</button>
        <button onclick="dockBtn(5)" style="flex:1; padding:8px; border:none; border-radius:8px; background:#334; color:#fff;">5</button>
      </div>
      <button class="menu-close" id="menuClose">Close</button>
    </div>
  </div>

  <!-- Image Zoom Overlay -->
  <div class="zoom-overlay" id="zoomOverlay">
    <img id="zoomImage" src="" alt="Card preview">
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    // =====================================================
    // FORMAT CONFIGURATION
    // =====================================================
    const FORMATS = {
      mtg_standard: {
        tcg: 'mtg',
        tcgName: 'Magic: The Gathering',
        formatName: 'Standard',
        searchPlaceholder: 'Search for MTG cards...',
        searchFilter: '',
        showTokenSearch: true,
        showListAll: false,
        storagePrefix: 'mtg',
        color: '#8b5cf6',
        accentColor: '#ec4899'
      },
      mtg_planechase: {
        tcg: 'mtg',
        tcgName: 'Magic: The Gathering',
        formatName: 'Planechase',
        searchPlaceholder: 'Search Planechase cards...',
        searchFilter: '(type:plane OR type:phenomenon)',
        showTokenSearch: false,
        showListAll: true,
        storagePrefix: 'mtg_planechase',
        color: '#ec4899',
        accentColor: '#8b5cf6'
      },
      mtg_momir: {
        tcg: 'mtg',
        tcgName: 'Magic: The Gathering',
        formatName: 'Momir',
        searchPlaceholder: 'Search creatures...',
        searchFilter: 't:creature',
        showTokenSearch: false,
        showListAll: false,
        storagePrefix: 'mtg_momir',
        color: '#22c55e',
        accentColor: '#38bdf8'
      }
    };

    // =====================================================
    // STATE
    // =====================================================
    let currentFormat = 'mtg_standard';
    let btDevice = null;
    let btCharacteristic = null;
    let cardPreferences = {};
    let favourites = [];
    let recentCards = [];
    let decks = [];
    let pendingDeckCard = null;

    const MAX_RECENT = 20;
    const EPD_W = 480, EPD_H = 800;
    const IMAGE_PACKED_SIZE = EPD_W * EPD_H / 4; // 2 bits per pixel = 96000
    const EPDB_W = 300, EPDB_H = 400;            // panel B (4.2" 400x300, portrait)
    const IMAGE_B_PACKED_SIZE = EPDB_W * EPDB_H / 4; // 30000

    // Display/conversion settings (persisted)
    let dispSettings = { mode: 'fullbleed', strim: 0, btrim: 5.5, ttrim: 0, gamma: 1.35, bright: 0, contrast: 10, dither: 'fs' };
    try { const s = localStorage.getItem('tc_display_settings'); if (s) dispSettings = Object.assign(dispSettings, JSON.parse(s)); } catch (e) {}
    function saveDispSettings() { try { localStorage.setItem('tc_display_settings', JSON.stringify(dispSettings)); } catch (e) {} }

    const btBtn = document.getElementById('btBtn');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const tokenBtn = document.getElementById('tokenBtn');
    const listAllBtn = document.getElementById('listAllBtn');
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function storageKey(key) {
      const prefix = FORMATS[currentFormat].storagePrefix;
      return `${prefix}_${key}`;
    }

    function loadFormatState() {
      cardPreferences = {};
      favourites = [];
      recentCards = [];
      decks = [];
      try { const s = localStorage.getItem(storageKey('card_preferences')); if (s) cardPreferences = JSON.parse(s); } catch (e) {}
      try { const s = localStorage.getItem(storageKey('favourites')); if (s) favourites = JSON.parse(s); } catch (e) {}
      try { const s = localStorage.getItem(storageKey('recent')); if (s) recentCards = JSON.parse(s); } catch (e) {}
      try { const s = localStorage.getItem(storageKey('decks')); if (s) decks = JSON.parse(s); } catch (e) {}
    }

    loadFormatState();

    function saveFavourites() { try { localStorage.setItem(storageKey('favourites'), JSON.stringify(favourites)); } catch (e) {} updateTabCounts(); }
    function saveRecent() { try { localStorage.setItem(storageKey('recent'), JSON.stringify(recentCards)); } catch (e) {} updateTabCounts(); }
    function saveDecks() { try { localStorage.setItem(storageKey('decks'), JSON.stringify(decks)); } catch (e) {} updateTabCounts(); }

    function updateTabCounts() {
      document.getElementById('favCount').textContent = favourites.length > 0 ? `(${favourites.length})` : '';
      document.getElementById('recentCount').textContent = recentCards.length > 0 ? `(${recentCards.length})` : '';
      document.getElementById('deckCount').textContent = decks.length > 0 ? `(${decks.length})` : '';
    }
    updateTabCounts();

    // =====================================================
    // TABS
    // =====================================================
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
        if (tab.dataset.tab === 'favourites') renderFavourites();
        if (tab.dataset.tab === 'recent') renderRecent();
        if (tab.dataset.tab === 'decks') renderDecks();
        if (tab.dataset.tab === 'dock') refreshDockList();
      });
    });

    // =====================================================
    // FORMAT SWITCHING (Menu Drawer)
    // =====================================================

    const menuBtn = document.getElementById('menuBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const formatBadge = document.getElementById('formatBadge');

    function openMenu() {
      menuOverlay.classList.add('open');
      menuBtn.classList.add('open');
    }

    function closeMenu() {
      menuOverlay.classList.remove('open');
      menuBtn.classList.remove('open');
    }

    menuBtn.addEventListener('click', openMenu);
    document.getElementById('menuClose').addEventListener('click', closeMenu);
    menuOverlay.addEventListener('click', (e) => { if (e.target === menuOverlay) closeMenu(); });

    function switchFormat(formatKey) {
      if (formatKey === currentFormat) { closeMenu(); return; }

      // End any active planechase/momir game
      if (pcGameActive) endPlanechaseGame();
      if (momirActive) endMomirGame(true);

      currentFormat = formatKey;
      try { localStorage.setItem('tc_active_format', formatKey); } catch (e) {}

      // Update menu selection
      document.querySelectorAll('.menu-option').forEach(o => o.classList.toggle('active', o.dataset.format === formatKey));

      // Update format badge
      const fmt = FORMATS[currentFormat];
      if (formatKey === 'mtg_standard') {
        formatBadge.classList.remove('visible');
      } else {
        formatBadge.textContent = fmt.formatName;
        formatBadge.classList.add('visible');
      }

      // Load format-specific state
      loadFormatState();

      // Update UI
      searchInput.placeholder = fmt.searchPlaceholder;
      tokenBtn.style.display = fmt.showTokenSearch ? '' : 'none';
      listAllBtn.style.display = fmt.showListAll ? '' : 'none';
      document.body.classList.toggle('pc-mode', formatKey === 'mtg_planechase');

      // Clear search results and reset to search tab
      resultsEl.innerHTML = '';
      searchInput.value = '';

      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab[data-tab="search"]').classList.add('active');
      document.getElementById('tab-search').classList.add('active');

      updateTabCounts();
      updateGamePanelVisibility();
      closeMenu();
    }

    document.querySelectorAll('.menu-option').forEach(opt => {
      opt.addEventListener('click', () => switchFormat(opt.dataset.format));
    });

    // Restore last active format
    try {
      const saved = localStorage.getItem('tc_active_format');
      if (saved && FORMATS[saved]) {
        currentFormat = saved;
        loadFormatState();
        document.querySelectorAll('.menu-option').forEach(o => o.classList.toggle('active', o.dataset.format === saved));
        const fmt = FORMATS[currentFormat];
        searchInput.placeholder = fmt.searchPlaceholder;
        tokenBtn.style.display = fmt.showTokenSearch ? '' : 'none';
        listAllBtn.style.display = fmt.showListAll ? '' : 'none';
        document.body.classList.toggle('pc-mode', saved === 'mtg_planechase');

          formatBadge.textContent = fmt.formatName;
          formatBadge.classList.add('visible');
        }
      }
    } catch (e) {}

    updateTabCounts();

    // =====================================================
    // PLANECHASE GAME STATE
    // =====================================================

    let pcGameActive = false;
    let pcShuffledDeck = [];     // shuffled copy of cards
    let pcCurrentIndex = 0;      // index in shuffled deck
    let pcSourceDeckIdx = null;  // which deck we're playing from

    function updateGamePanelVisibility() {
      document.getElementById('pcGamePanel').classList.toggle('visible', pcGameActive && currentFormat === 'mtg_planechase');
      updateMomirPanelVisibility();
    }

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startPlanechaseGame(deckIdx) {
      const deck = decks[deckIdx];
      if (!deck || deck.cards.length === 0) {
        showStatus('Deck is empty — add some planes first', 'error');
        return;
      }

      pcSourceDeckIdx = deckIdx;
      pcShuffledDeck = shuffleArray(deck.cards);
      pcCurrentIndex = 0;
      pcGameActive = true;

      updateGamePanelVisibility();
      renderCurrentPlane();
      sendCurrentPlane();

      showStatus(`Planechase started! Playing "${deck.name}" (${pcShuffledDeck.length} planes)`, 'success');
    }

    function renderCurrentPlane() {
      if (!pcGameActive || pcShuffledDeck.length === 0) return;
      const card = pcShuffledDeck[pcCurrentIndex];
      document.getElementById('pcPlaneThumb').src = card.image_small;
      document.getElementById('pcPlaneName').textContent = card.name;
      document.getElementById('pcPlaneMeta').textContent = `${card.set_name} (${card.set.toUpperCase()})`;
      document.getElementById('pcPosition').textContent = `Plane ${pcCurrentIndex + 1} of ${pcShuffledDeck.length}`;
    }

    async function sendCurrentPlane() {
      if (!pcGameActive || pcShuffledDeck.length === 0) return;
      const card = pcShuffledDeck[pcCurrentIndex];
      if (!card.image_large) { showStatus('No image for this plane', 'error'); return; }
      await sendCard(card.image_large, card.name);
    }

    function planeswalk() {
      if (!pcGameActive || pcShuffledDeck.length === 0) return;
      // Move current card to the bottom of the deck
      const current = pcShuffledDeck.splice(pcCurrentIndex, 1)[0];
      pcShuffledDeck.push(current);
      // pcCurrentIndex stays at 0 since we always draw from current position
      // But if we were at the end, wrap around
      if (pcCurrentIndex >= pcShuffledDeck.length) pcCurrentIndex = 0;

      renderCurrentPlane();
      sendCurrentPlane();
    }

    function endPlanechaseGame() {
      pcGameActive = false;
      pcShuffledDeck = [];
      pcCurrentIndex = 0;
      pcSourceDeckIdx = null;
      updateGamePanelVisibility();
      renderDecks();
      showStatus('Planechase game ended', 'info');
    }

    // Wire up game panel buttons
    document.getElementById('pcPlaneswalkBtn').addEventListener('click', planeswalk);
    document.getElementById('pcResendBtn').addEventListener('click', sendCurrentPlane);
    document.getElementById('pcStopBtn').addEventListener('click', () => {
      endPlanechaseGame();
    });

    // =====================================================
    // MOMIR MODE
    // =====================================================
    // Pay X: fetch a random Vintage-legal creature with mana value
    // exactly X from Scryfall and send it to the dock.

    let momirActive = false;
    let momirX = null;      // selected mana value
    let momirBusy = false;  // one summon at a time
    let momirNum = 0;       // summons this game
    let momirLast = null;   // last summoned card {name, image_large}

    function updateMomirPanelVisibility() {
      const inMomir = currentFormat === 'mtg_momir';
      document.getElementById('momirPanel').classList.toggle('visible', inMomir);
      document.getElementById('momirGame').style.display = momirActive ? '' : 'none';
      document.getElementById('momirStartBtn').style.display = momirActive ? 'none' : '';
      document.getElementById('momirStopBtn').style.display = momirActive ? '' : 'none';
    }

    // build the mana-value chips (0-16; Draco tops out at 16)
    (function buildMomirChips() {
      const wrap = document.getElementById('momirChips');
      for (let x = 0; x <= 16; x++) {
        const b = document.createElement('button');
        b.className = 'momir-chip';
        b.textContent = x;
        b.addEventListener('click', () => {
          momirX = x;
          wrap.querySelectorAll('.momir-chip').forEach(c => c.classList.toggle('selected', +c.textContent === x));
          const sb = document.getElementById('momirSummonBtn');
          sb.disabled = false;
          sb.innerHTML = `&#127922; Summon for X = ${x}`;
        });
        wrap.appendChild(b);
      }
    })();

    function startMomirGame() {
      momirActive = true;
      momirX = null;
      momirNum = 0;
      momirLast = null;
      document.querySelectorAll('#momirChips .momir-chip').forEach(c => c.classList.remove('selected'));
      const sb = document.getElementById('momirSummonBtn');
      sb.disabled = true;
      sb.innerHTML = '&#127922; Summon';
      document.getElementById('momirLastRow').style.display = 'none';
      updateMomirPanelVisibility();
      showStatus('Momir game started! Pick a mana value and summon.', 'success');
    }

    function endMomirGame(quiet) {
      momirActive = false;
      updateMomirPanelVisibility();
      if (!quiet) showStatus(`Momir game ended — ${momirNum} creature${momirNum === 1 ? '' : 's'} summoned`, 'info');
    }

    function renderMomirLast(card) {
      const f = (card.card_faces && card.card_faces[0]) || card;
      const pt = (f.power != null && f.toughness != null) ? ` • ${f.power}/${f.toughness}` : '';
      document.getElementById('momirThumb').src = momirLast.image_small;
      document.getElementById('momirName').textContent = card.name;
      document.getElementById('momirMeta').textContent = (f.type_line || card.type_line || '') + pt;
      document.getElementById('momirCount').textContent = `Summon #${momirNum} • X = ${momirX}`;
      document.getElementById('momirLastRow').style.display = '';
    }

    async function momirSummon() {
      if (!momirActive || momirX === null || momirBusy) return;
      momirBusy = true;
      const sb = document.getElementById('momirSummonBtn');
      sb.disabled = true;
      sb.textContent = 'Conjuring...';
      try {
        const q = `t:creature cmc=${momirX} legal:vintage game:paper`;
        const r = await fetch('https://api.scryfall.com/cards/random?q=' + encodeURIComponent(q));
        if (!r.ok) throw new Error('no creature exists at that mana value');
        const card = await r.json();
        const uris = getImageUris(card);
        momirLast = {
          name: card.name,
          image_small: uris?.small || '',
          image_large: uris?.png || uris?.large || ''
        };
        momirNum++;
        renderMomirLast(card);
        if (!momirLast.image_large) throw new Error('no image for ' + card.name);
        await sendCard(momirLast.image_large, card.name);
      } catch (e) {
        showStatus('Momir fizzled: ' + e.message, 'error');
      }
      sb.disabled = false;
      sb.innerHTML = `&#127922; Summon for X = ${momirX}`;
      momirBusy = false;
    }

    document.getElementById('momirStartBtn').addEventListener('click', startMomirGame);
    document.getElementById('momirStopBtn').addEventListener('click', () => endMomirGame(false));
    document.getElementById('momirSummonBtn').addEventListener('click', momirSummon);
    document.getElementById('momirResendBtn').addEventListener('click', () => {
      if (momirLast && momirLast.image_large) sendCard(momirLast.image_large, momirLast.name);

    updateMomirPanelVisibility();

    // =====================================================
    // IMAGE ZOOM
    // =====================================================

    const zoomOverlay = document.getElementById('zoomOverlay');
    const zoomImage = document.getElementById('zoomImage');

    window.zoomCard = function(smallUrl) {
      const largeUrl = smallUrl.replace('/small/', '/large/').replace('?format=image', '?format=image');
      zoomImage.src = largeUrl;
      zoomOverlay.classList.toggle('pc-rotate', currentFormat === 'mtg_planechase');
      zoomOverlay.classList.add('open');
    };

    zoomOverlay.addEventListener('click', () => {
      zoomOverlay.classList.remove('open', 'pc-rotate');
      zoomImage.src = '';
    });

    // =====================================================
    // CARD DATA HELPERS
    // =====================================================

    function getImageUris(card) {
      if (card.image_uris) return card.image_uris;
      if (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris) return card.card_faces[0].image_uris;
      return null;
    }

    // back face of a double-sided card (transform/modal DFC); null for normal cards.
    // Split/adventure cards share one image, so card_faces[1].image_uris only exists on true DFCs.
    function getBackImageUris(card) {
      return (card.card_faces && card.card_faces[1] && card.card_faces[1].image_uris) || null;
    }

    // a card object representing the chosen face: face 1 = back, acts as its own card
    // everywhere (send, dock save, favourite, deck). Distinct id so it stores separately.
    function faceCard(card, face) {
      if (!face) return card;
      const bf = card.card_faces && card.card_faces[1];
      if (!bf || !bf.image_uris) return card;
      return { ...card,
        id: 'b' + String(card.id || '').slice(1),
        name: bf.name || (card.name + ' (back)'),
        image_uris: bf.image_uris,
        type_line: bf.type_line || card.type_line,
        power: bf.power, toughness: bf.toughness,
        oracle_text: bf.oracle_text,
        card_faces: undefined };
    }

    function selectedCardWithFace(cardEl) {
      const versions = JSON.parse(cardEl.dataset.versions);
      const card = versions[parseInt(cardEl.dataset.selectedIndex) || 0];
      return faceCard(card, cardEl.dataset.face === '1' ? 1 : 0);
    }

    function cardToStorable(card) {
      const uris = getImageUris(card);
      return {
        name: card.name, set: card.set, set_name: card.set_name, id: card.id,
        image_small: uris?.small || '', image_large: uris?.png || uris?.large || ''
      };
    }

    function isFavourited(cardId) { return favourites.some(f => f.id === cardId); }

    function toggleFavourite(card) {
      const idx = favourites.findIndex(f => f.id === card.id);
      if (idx >= 0) favourites.splice(idx, 1);
      else favourites.push(cardToStorable(card));
      saveFavourites();
    }

    function addToRecent(card) {
      recentCards = recentCards.filter(r => r.id !== card.id);
      const entry = cardToStorable(card);
      entry.sentAt = Date.now();
      recentCards.unshift(entry);
      if (recentCards.length > MAX_RECENT) recentCards = recentCards.slice(0, MAX_RECENT);
      saveRecent();
    }

    function refreshSearchFavStars() {
      resultsEl.querySelectorAll('.card-item').forEach(cardEl => {
        try {
          const versions = JSON.parse(cardEl.dataset.versions);
          const card = versions[parseInt(cardEl.dataset.selectedIndex)];
          const safe = card.name.replace(/[^a-z0-9]/gi, '');
          const favBtn = document.getElementById(`fav-${safe}`);
          if (favBtn) favBtn.classList.toggle('favourited', isFavourited(card.id));
        } catch (e) {}
      });
    }

    // =====================================================
    // BLUETOOTH
    // =====================================================

    const SVC_UUID  = '7a0b1000-8f5e-4c2a-9b3d-1c2e3f405060';
    const CTRL_UUID = '7a0b1001-8f5e-4c2a-9b3d-1c2e3f405060';
    const DATA_UUID = '7a0b1002-8f5e-4c2a-9b3d-1c2e3f405060';
    let ctrlChar = null, dataChar = null;
    let ackBase = 0;
    let bleWaiters = [];

    function onCtrlNotify(e) {
      const msg = new TextDecoder().decode(e.target.value);
      if (msg.startsWith('A:')) { ackBase = parseInt(msg.slice(2)) || ackBase; }
      bleWaiters = bleWaiters.filter(w => {
        if (msg.startsWith(w.prefix)) { w.resolve(msg); return false; }
        return true;
      });
      if (msg.startsWith('D:')) {
        if (msg !== 'D:END') {
          const parts = msg.slice(2).split('|');
          dockDecks.push({ name: parts[0] || '?', count: parseInt(parts[1]) || 0 });
        }
      }
      if (msg.startsWith('L:')) {
        if (msg === 'L:END') renderDockList();
        else {
          const parts = msg.slice(2).split('|');
          dockCards.push({ id: parts[0] || '', name: parts[1] || '?', pt: parts[2] || '',
                           type: parts[3] || '', sid: parts[4] || '', fav: parts[5] === '1' });
        }
      }
      if (msg.startsWith('W:')) {
        if (msg === 'W:END') renderWifiScan(true);
        else {
          const parts = msg.slice(2).split('|');
          wifiScanResults.push({ rssi: parseInt(parts[0]) || -99, enc: parts[1] === '1', ssid: parts.slice(2).join('|') });
          renderWifiScan(false);
        }
      }
      if (msg.startsWith('WIFI:')) {
        const w = msg.slice(5);
        if (w.startsWith('OK')) {
          try { localStorage.setItem('tc_dock_ip', w.slice(3).trim()); } catch (e) {}
        }
        showStatus(w.startsWith('OK') ? 'Dock is on WiFi (' + w.slice(3) + ')' : 'Dock WiFi failed - check details', w.startsWith('OK') ? 'success' : 'error');
      }
      if (msg.startsWith('ERR')) showStatus('Dock error: ' + msg, 'error');
    }

    function bleWaitFor(prefix, timeoutMs) {
      return new Promise((resolve, reject) => {
        const w = { prefix, resolve };
        bleWaiters.push(w);
        setTimeout(() => { bleWaiters = bleWaiters.filter(x => x !== w); reject(new Error('Timeout: ' + prefix)); }, timeoutMs);
      });
    }

    btBtn.addEventListener('click', async () => {
      try {
        showStatus('Connecting...', 'info');
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'TokenConjurer' }],
          optionalServices: [SVC_UUID]
        });
        device.addEventListener('gattserverdisconnected', () => {
          ctrlChar = null; dataChar = null; btCharacteristic = null;
          btBtn.textContent = 'Connect BT';
          btBtn.classList.remove('connected');
          showStatus('Dock disconnected', 'error');
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SVC_UUID);
        ctrlChar = await service.getCharacteristic(CTRL_UUID);
        dataChar = await service.getCharacteristic(DATA_UUID);
        await ctrlChar.startNotifications();
        ctrlChar.addEventListener('characteristicvaluechanged', onCtrlNotify);
        btCharacteristic = dataChar; // legacy truthiness checks elsewhere
        btDevice = device;
        btBtn.textContent = 'Connected';
        btBtn.classList.add('connected');
        showStatus('Connected to ' + device.name + '!', 'success');
      } catch (error) {
        showStatus('Connection failed: ' + error.message, 'error');
      }
    });

    // =====================================================
    // SEARCH
    // =====================================================
    searchBtn.addEventListener('click', () => searchCards(false));
    tokenBtn.addEventListener('click', () => searchCards(true));
    listAllBtn.addEventListener('click', () => listAllPlanechase());
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchCards(false); });

    async function listAllPlanechase() {
      searchBtn.disabled = true;
      listAllBtn.disabled = true;
      resultsEl.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading all Planechase cards...</div></div>';

      try {
        const fmt = FORMATS[currentFormat];
        const q = fmt.searchFilter || '(type:plane OR type:phenomenon)';
        let allCards = [];
        let url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}&unique=prints&order=name`;

        while (url) {
          const resp = await fetch(url);
          const data = await resp.json();
          if (data.data) allCards = allCards.concat(data.data);
          url = data.has_more ? data.next_page : null;
          if (url) await new Promise(r => setTimeout(r, 100)); // rate limit courtesy
        }

        if (allCards.length > 0) {
          const grouped = {};
          allCards.forEach(card => { if (!grouped[card.name]) grouped[card.name] = []; grouped[card.name].push(card); });
          displayGroupedCards(grouped);
        } else {
          resultsEl.innerHTML = '<div class="loading">No cards found</div>';
        }
      } catch (error) {
        resultsEl.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
      } finally {
        searchBtn.disabled = false;
        listAllBtn.disabled = false;
      }
    }

    async function searchCards(isToken = false) {
      const query = searchInput.value.trim();
      if (!query) return;
      searchBtn.disabled = true;
      tokenBtn.disabled = true;
      listAllBtn.disabled = true;
      resultsEl.innerHTML = '<div class="loading"><div class="spinner"></div><div>Searching Scryfall...</div></div>';

      try {
        const fmt = FORMATS[currentFormat];
        let sq = query;
        if (isToken) sq = `${query} is:token`;
        if (fmt.searchFilter) sq = `${sq} ${fmt.searchFilter}`;
        const resp = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(sq)}&unique=prints&order=released`);
        const data = await resp.json();
        if (data.data && data.data.length > 0) {
          const grouped = {};
          data.data.forEach(card => { if (!grouped[card.name]) grouped[card.name] = []; grouped[card.name].push(card); });
          displayGroupedCards(grouped);
        } else {
          resultsEl.innerHTML = '<div class="loading">No cards found</div>';
        }
      } catch (error) {
        resultsEl.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
      } finally {
        searchBtn.disabled = false;
        tokenBtn.disabled = false;
        listAllBtn.disabled = false;
      }
    }

    function displayGroupedCards(grouped) {
      resultsEl.innerHTML = '';
      Object.entries(grouped).forEach(([cardName, versions]) => {
        const preferredSet = cardPreferences[cardName];
        let selectedVersion = versions.find(v => v.set === preferredSet) || versions[0];
        const isPreferred = preferredSet && selectedVersion.set === preferredSet;
        const uris = getImageUris(selectedVersion);
        const fav = isFavourited(selectedVersion.id);
        const safe = cardName.replace(/[^a-z0-9]/gi, '');
        const escaped = cardName.replace(/'/g, "\\'");

        const cardEl = document.createElement('div');
        cardEl.className = 'card-item';
        cardEl.innerHTML = `
          <div class="card-main">
            <img class="card-thumb" src="${uris?.small || ''}" alt="${cardName}" id="thumb-${safe}" onclick="zoomCard(this.src)">
            <div class="card-info">
              <div class="card-name">${cardName}${isPreferred ? '<span class="preferred-badge">Preferred</span>' : ''}</div>
              <div class="card-set" id="set-${safe}">${selectedVersion.set_name} (${selectedVersion.set.toUpperCase()})</div>
              ${versions.length > 1 ? `<div class="version-toggle" onclick="toggleVersions('${escaped}')">Choose version (${versions.length})</div>` : ''}
              ${getBackImageUris(selectedVersion) ? `<div class="version-toggle" id="face-${safe}" onclick="toggleFace('${escaped}')">Showing: Front &#8644;</div>` : ''}
            </div>
          </div>
          <div class="card-actions">
            <button class="send-btn" onclick="sendSelectedCard('${escaped}')">Send to E-Paper</button>
            <button class="deck-add-btn" onclick="saveSelectedToDock('${escaped}')" title="Save to dock">Dock+</button>
            <button class="fav-btn ${fav ? 'favourited' : ''}" id="fav-${safe}" onclick="toggleFavFromSearch('${escaped}')">&#9733;</button>
            <button class="deck-add-btn" onclick="addToDeckFromSearch('${escaped}')" title="Add to deck">+D</button>
          </div>
          ${versions.length > 1 ? `
            <div class="version-selector" id="versions-${safe}">
              ${versions.map((v, idx) => `
                <button class="version-btn ${v.id === selectedVersion.id ? 'selected' : ''}"
                        onclick="selectVersion('${escaped}', ${idx})">${v.set.toUpperCase()}</button>
              `).join('')}
            </div>` : ''}
        `;
        resultsEl.appendChild(cardEl);
        cardEl.dataset.versions = JSON.stringify(versions);
        cardEl.dataset.face = '0';
        cardEl.dataset.selectedIndex = versions.findIndex(v => v.id === selectedVersion.id).toString();
      });
    }

    window.toggleVersions = function(cardName) {
      const el = document.getElementById(`versions-${cardName.replace(/[^a-z0-9]/gi, '')}`);
      if (el) el.classList.toggle('open');
    };

    window.selectVersion = function(cardName, idx) {
      const safe = cardName.replace(/[^a-z0-9]/gi, '');
      const cardEl = Array.from(resultsEl.children).find(el => el.querySelector(`#thumb-${safe}`));
      if (!cardEl) return;
      const versions = JSON.parse(cardEl.dataset.versions);
      const selected = versions[idx];
      cardEl.dataset.selectedIndex = idx;
      // face choice sticks across printings of this card (reset only if the new printing has no back)
      if (cardEl.dataset.face === '1' && !getBackImageUris(selected)) cardEl.dataset.face = '0';
      const face = cardEl.dataset.face === '1' ? 1 : 0;
      const faceLbl = document.getElementById(`face-${safe}`);
      if (faceLbl) faceLbl.innerHTML = 'Showing: ' + (face ? 'Back' : 'Front') + ' &#8644;';
      const uris = getImageUris(faceCard(selected, face));
      document.getElementById(`thumb-${safe}`).src = uris?.small || '';
      document.getElementById(`set-${safe}`).textContent = `${selected.set_name} (${selected.set.toUpperCase()})`;
      const nameEl = cardEl.querySelector('.card-name');
      nameEl.innerHTML = cardName + '<span class="preferred-badge">Preferred</span>';
      document.querySelectorAll(`#versions-${safe} .version-btn`).forEach((btn, i) => { btn.classList.toggle('selected', i === idx); });
      const favBtn = document.getElementById(`fav-${safe}`);
      if (favBtn) favBtn.classList.toggle('favourited', isFavourited(selected.id));
      cardPreferences[cardName] = selected.set;
      try { localStorage.setItem(storageKey('card_preferences'), JSON.stringify(cardPreferences)); } catch (e) {}
    };

    window.toggleFace = function(cardName) {
      const safe = cardName.replace(/[^a-z0-9]/gi, '');
      const cardEl = Array.from(resultsEl.children).find(el => el.querySelector(`#thumb-${safe}`));
      if (!cardEl) return;
      const face = cardEl.dataset.face === '1' ? 0 : 1;
      cardEl.dataset.face = String(face);
      const card = selectedCardWithFace(cardEl);
      const uris = getImageUris(card);
      const thumb = document.getElementById(`thumb-${safe}`);
      if (thumb && uris) thumb.src = uris.small || thumb.src;
      const lbl = document.getElementById(`face-${safe}`);
      if (lbl) lbl.innerHTML = 'Showing: ' + (face ? 'Back' : 'Front') + ' &#8644;';
    };

    window.toggleFavFromSearch = function(cardName) {
      const safe = cardName.replace(/[^a-z0-9]/gi, '');
      const cardEl = Array.from(resultsEl.children).find(el => el.querySelector(`#thumb-${safe}`));
      if (!cardEl) return;
      const card = selectedCardWithFace(cardEl);
      toggleFavourite(card);
      const favBtn = document.getElementById(`fav-${safe}`);
      if (favBtn) favBtn.classList.toggle('favourited', isFavourited(card.id));
    };

      const cardEl = Array.from(resultsEl.children).find(el => el.querySelector(`#thumb-${safe}`));
      if (!cardEl) return;
      const card = selectedCardWithFace(cardEl);

      if (!uris) { showStatus('No image available', 'error'); return; }
      addToRecent(card);
      await sendCard(uris.png || uris.large, card.name);

    window.saveSelectedToDock = async function(cardName) {
      const safe = cardName.replace(/[^a-z0-9]/gi, '');
      const cardEl = Array.from(resultsEl.children).find(el => el.querySelector(`#thumb-${safe}`));
      if (!cardEl) return;
      const card = selectedCardWithFace(cardEl);
      const uris = getImageUris(card);
      if (!uris) { showStatus('No image available', 'error'); return; }
      await saveCardToDock(card, uris.png || uris.large);

      if (!card || !card.image_large) { showStatus('No image available', 'error'); return; }
      await saveCardToDock(card, card.image_large);

      const safe = cardName.replace(/[^a-z0-9]/gi, '');
      const cardEl = Array.from(resultsEl.children).find(el => el.querySelector(`#thumb-${safe}`));

    // =====================================================
    // DECK PICKER MODAL
    // =====================================================

    function openDeckPicker(card) {
      pendingDeckCard = card;
      const list = document.getElementById('deckModalList');
      list.innerHTML = '';
      decks.forEach((deck, idx) => {
        const alreadyIn = deck.cards.some(c => c.id === card.id);
        const btn = document.createElement('button');
        btn.className = 'modal-deck-btn';
        btn.innerHTML = `${deck.name} <span class="modal-deck-count">${deck.cards.length} cards${alreadyIn ? ' · already added' : ''}</span>`;
        btn.disabled = alreadyIn;
        btn.style.opacity = alreadyIn ? '0.5' : '1';
        btn.onclick = () => { addCardToDeck(idx, card); closeDeckPicker(); };
        list.appendChild(btn);
      });
      document.getElementById('deckModal').classList.add('open');
    }

    function closeDeckPicker() {
      document.getElementById('deckModal').classList.remove('open');
      pendingDeckCard = null;
    }

    document.getElementById('modalCancel').onclick = closeDeckPicker;
    document.getElementById('deckModal').onclick = (e) => { if (e.target.id === 'deckModal') closeDeckPicker(); };

    document.getElementById('modalNewDeck').onclick = () => {
      const name = prompt('Deck name:');
      if (!name || !name.trim()) return;
      decks.push({ name: name.trim(), cards: [] });
      saveDecks();
      if (pendingDeckCard) {
        addCardToDeck(decks.length - 1, pendingDeckCard);
        closeDeckPicker();
      } else {
        closeDeckPicker();
        renderDecks();
      }
    };

    function addCardToDeck(deckIdx, card) {
      const storable = cardToStorable(card);
      if (!decks[deckIdx].cards.some(c => c.id === storable.id)) {
        decks[deckIdx].cards.push(storable);
        saveDecks();
        showStatus(`Added to ${decks[deckIdx].name}`, 'success');
      }
    }

          <button class="new-deck-btn" onclick="createNewDeck()">+ Create New Deck</button>
          <div class="empty-state">

          </div>`;

      el.innerHTML = '<button class="new-deck-btn" onclick="createNewDeck()">+ Create New Deck</button>';

      decks.forEach((deck, di) => {

        div.className = 'deck-item';
        div.id = `deck-${di}`;

        const isPlaying = isPlanechase && pcGameActive && pcSourceDeckIdx === di;

        let cardsHTML = '';

          deck.cards.forEach((card, ci) => {
            cardsHTML += `
              <div class="deck-card-row">

          ? `<button class="deck-play-btn" onclick="event.stopPropagation();startPCGame(${di})" ${isPlaying ? 'disabled style="opacity:0.5"' : ''}>${isPlaying ? '&#9654; Playing...' : '<span class="pw-icon"></span> Play'}</button>`

          ? `<div style="padding:14px 0;color:#888;text-align:center;font-size:13px;">Deck is in play — contents hidden</div>
             <div class="deck-actions">

      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
