    // =====================================================
    // IMAGE PROCESSING - 4-grey 480x800 pipeline
    // =====================================================

    function buildRowMap(srcH) {
      const zones = [
        {a:0.000, b:0.055, w:0.55}, {a:0.055, b:0.110, w:1.00},
        {a:0.110, b:0.575, w:1.00}, {a:0.575, b:0.635, w:1.00},
        {a:0.635, b:0.930, w:0.80}, {a:0.930, b:1.000, w:0.35},
      ];
      let weighted = 0;
      zones.forEach(z => weighted += (z.b - z.a) * srcH * z.w);
      const k = EPD_H / weighted;
      const map = new Float32Array(EPD_H);
      let outRow = 0;
      for (const z of zones) {
        const srcSpan = (z.b - z.a) * srcH;
        const dstRows = Math.round(srcSpan * z.w * k);
        for (let r = 0; r < dstRows && outRow < EPD_H; r++, outRow++) {
          map[outRow] = z.a * srcH + (r / dstRows) * srcSpan;
        }
      }
      while (outRow < EPD_H) { map[outRow] = srcH - 1; outRow++; }
      return map;
    }

    // Returns a portrait-oriented source canvas; landscape cards (planes!) rotate 90deg
    function portraitSource(img) {
      if (img.width <= img.height) return img;
      const c = document.createElement('canvas');
      c.width = img.height; c.height = img.width;
      const x = c.getContext('2d');
      x.translate(c.width / 2, c.height / 2);
      x.rotate(Math.PI / 2);
      x.drawImage(img, -img.width / 2, -img.height / 2);
      return c;
    }

    function preCropCard(source) {
      const st = dispSettings.strim / 100, bt = dispSettings.btrim / 100, tt = dispSettings.ttrim / 100;
      const sw = source.width * (1 - 2 * st), sh = source.height * (1 - tt - bt);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(sw));
      c.height = Math.max(1, Math.round(sh));
      const x = c.getContext('2d');
      x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
      x.drawImage(source, source.width * st, source.height * tt, sw, sh, 0, 0, c.width, c.height);
      return c;
    }

    function composeFrame(card, mode) {
      const c = document.createElement('canvas'); c.width = EPD_W; c.height = EPD_H;
      const x = c.getContext('2d');
      x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
      const cardH = Math.round(card.height * (EPD_W / card.width));
      const y0 = Math.round((EPD_H - cardH) / 2);

      if (mode === 'fullbleed') {
        const scale = Math.max(EPD_W / card.width, EPD_H / card.height);
        x.drawImage(card, (EPD_W - card.width * scale) / 2, 0, card.width * scale, card.height * scale);
      } else if (mode === 'fill-blur') {
        const cover = Math.max(EPD_W / card.width, EPD_H / card.height) * 1.1;
        x.filter = 'blur(18px) brightness(0.8)';
        x.drawImage(card, (EPD_W - card.width * cover) / 2, (EPD_H - card.height * cover) / 2, card.width * cover, card.height * cover);
        x.filter = 'none';
        if (cardH <= EPD_H) x.drawImage(card, 0, y0, EPD_W, cardH);
        else { const s2 = EPD_H / card.height, w2 = card.width * s2; x.drawImage(card, (EPD_W - w2) / 2, 0, w2, EPD_H); }
      } else if (mode === 'fill-mirror') {
        if (cardH <= EPD_H) {
          x.drawImage(card, 0, y0, EPD_W, cardH);
          if (y0 > 0) {
            x.save(); x.translate(0, y0); x.scale(1, -1);
            x.drawImage(card, 0, 0, card.width, card.height * (y0 / cardH), 0, 0, EPD_W, y0);
            x.restore();
            x.save(); x.translate(0, y0 + cardH); x.scale(1, -1);
            const srcStrip = card.height * (y0 / cardH);
            x.drawImage(card, 0, card.height - srcStrip, card.width, srcStrip, 0, -(EPD_H - (y0 + cardH)), EPD_W, EPD_H - (y0 + cardH));
            x.restore();
          }
        } else { const s2 = EPD_H / card.height, w2 = card.width * s2; x.fillStyle = '#fff'; x.fillRect(0, 0, EPD_W, EPD_H); x.drawImage(card, (EPD_W - w2) / 2, 0, w2, EPD_H); }
      } else if (mode === 'fill-black' || mode === 'fill-white') {
        x.fillStyle = mode === 'fill-black' ? '#000' : '#fff';
        x.fillRect(0, 0, EPD_W, EPD_H);
        if (cardH <= EPD_H) x.drawImage(card, 0, y0, EPD_W, cardH);
        else { const s2 = EPD_H / card.height, w2 = card.width * s2; x.drawImage(card, (EPD_W - w2) / 2, 0, w2, EPD_H); }
      } else { // smart / plain stretch handled via row map below using this true-aspect draw
        return null;
      }
      return x.getImageData(0, 0, EPD_W, EPD_H);
    }

    function processImageNew(imgLike) {
      const card = preCropCard(imgLike);
      const mode = dispSettings.mode;
      const gamma = dispSettings.gamma, bright = dispSettings.bright, contrast = dispSettings.contrast;
      const cf = (259 * (contrast + 255)) / (255 * (259 - contrast));
      const tone = v => {
        let t = 255 * Math.pow(v / 255, gamma);
        t = cf * (t - 128) + 128 + bright;
        return Math.max(0, Math.min(255, t));
      };

      const grey = new Float32Array(EPD_W * EPD_H);
      const composed = composeFrame(card, mode);
      if (composed) {
        for (let i = 0; i < EPD_W * EPD_H; i++) {
          grey[i] = tone(0.299 * composed.data[i*4] + 0.587 * composed.data[i*4+1] + 0.114 * composed.data[i*4+2]);
        }
      } else {
        const trueH = Math.round(card.height * (EPD_W / card.width));
        const work = document.createElement('canvas'); work.width = EPD_W; work.height = trueH;
        const wx = work.getContext('2d');
        wx.imageSmoothingEnabled = true; wx.imageSmoothingQuality = 'high';
        wx.drawImage(card, 0, 0, EPD_W, trueH);
        const sd = wx.getImageData(0, 0, EPD_W, trueH);
        const map = (mode === 'smart' && trueH > EPD_H) ? buildRowMap(trueH) : null;
        for (let y = 0; y < EPD_H; y++) {
          const sy = map ? Math.min(trueH - 1, Math.floor(map[y]))
                         : Math.min(trueH - 1, Math.floor(y * trueH / EPD_H));
          for (let xx = 0; xx < EPD_W; xx++) {
            const si = (sy * EPD_W + xx) * 4;
            grey[y * EPD_W + xx] = tone(0.299 * sd.data[si] + 0.587 * sd.data[si+1] + 0.114 * sd.data[si+2]);
          }
        }
      }

      // panel B: render DIRECT from the source card scan at native 300x400.
      // Card aspect (~0.72) nearly matches this panel (0.75): cover-fit, ~2% crop only.
      // Uses the border-trimmed card, skips the tall-panel compose modes entirely.
      const dstC = document.createElement('canvas'); dstC.width = EPDB_W; dstC.height = EPDB_H;
      const dctx = dstC.getContext('2d');
      dctx.fillStyle = '#fff'; dctx.fillRect(0, 0, EPDB_W, EPDB_H);
      dctx.imageSmoothingEnabled = true; dctx.imageSmoothingQuality = 'high';
      const bs = Math.max(EPDB_W / card.width, EPDB_H / card.height);
      dctx.drawImage(card, (EPDB_W - card.width * bs) / 2, (EPDB_H - card.height * bs) / 2,
                     card.width * bs, card.height * bs);
      const did = dctx.getImageData(0, 0, EPDB_W, EPDB_H);
      const greyB = new Float32Array(EPDB_W * EPDB_H);
      for (let i = 0; i < EPDB_W * EPDB_H; i++) {
        greyB[i] = tone(0.299 * did.data[i*4] + 0.587 * did.data[i*4+1] + 0.114 * did.data[i*4+2]);
      }
      { // gentle unsharp: greyB + 0.35*(greyB - 3x3 blur)
        const blur = new Float32Array(EPDB_W * EPDB_H);
        for (let y = 0; y < EPDB_H; y++) {
          for (let xx = 0; xx < EPDB_W; xx++) {
            let acc = 0, n = 0;
            for (let dy = -1; dy <= 1; dy++) {
              const yy = y + dy; if (yy < 0 || yy >= EPDB_H) continue;
              for (let dx = -1; dx <= 1; dx++) {
                const xb = xx + dx; if (xb < 0 || xb >= EPDB_W) continue;
                acc += greyB[yy * EPDB_W + xb]; n++;
              }
            }
            blur[y * EPDB_W + xx] = acc / n;
          }
        }
        for (let i = 0; i < EPDB_W * EPDB_H; i++) {
          greyB[i] = Math.max(0, Math.min(255, greyB[i] + (greyB[i] - blur[i]) * 0.35));
        }
      }

      // Floyd-Steinberg to 4 levels
      const useFS = dispSettings.dither === 'fs';
      const lvl = v => Math.round(Math.max(0, Math.min(255, v)) / 85) * 85;
      const out = new Uint8Array(EPD_W * EPD_H);
      for (let y = 0; y < EPD_H; y++) {
        for (let xx = 0; xx < EPD_W; xx++) {
          const i = y * EPD_W + xx;
          const old = grey[i];
          const nv = lvl(old);
          out[i] = nv;
          if (useFS) {
            const err = old - nv;
            if (xx + 1 < EPD_W)               grey[i + 1]          += err * 7 / 16;
            if (y + 1 < EPD_H) {
              if (xx > 0)                     grey[i + EPD_W - 1]  += err * 3 / 16;
                                              grey[i + EPD_W]      += err * 5 / 16;
              if (xx + 1 < EPD_W)             grey[i + EPD_W + 1]  += err * 1 / 16;
            }
          }
        }
      }
      // pack 2 bits/px, 4 px/byte, MSB first (0=black..3=white)
      const packed = new Uint8Array(IMAGE_PACKED_SIZE);
      for (let i = 0; i < EPD_W * EPD_H; i++) {
        packed[i >> 2] |= (out[i] / 85) << (6 - (i & 3) * 2);
      }

      // panel B: dither natively at 300x400 (same FS kernel), then pack
      const outB = new Uint8Array(EPDB_W * EPDB_H);
      for (let y = 0; y < EPDB_H; y++) {
        for (let xx = 0; xx < EPDB_W; xx++) {
          const i = y * EPDB_W + xx;
          const old = greyB[i];
          const nv = lvl(old);
          outB[i] = nv;
          if (useFS) {
            const err = old - nv;
            if (xx + 1 < EPDB_W)               greyB[i + 1]           += err * 7 / 16;
            if (y + 1 < EPDB_H) {
              if (xx > 0)                      greyB[i + EPDB_W - 1]  += err * 3 / 16;
                                               greyB[i + EPDB_W]      += err * 5 / 16;
              if (xx + 1 < EPDB_W)             greyB[i + EPDB_W + 1]  += err * 1 / 16;
            }
          }
        }
      }
      const packedB = new Uint8Array(IMAGE_B_PACKED_SIZE);
      for (let i = 0; i < EPDB_W * EPDB_H; i++) {
        packedB[i >> 2] |= (outB[i] / 85) << (6 - (i & 3) * 2);
      }
      packed.packedB = packedB;   // rides along with the main render
      return packed;
    }

    // =====================================================
    // BLE TRANSFER - flow-controlled protocol (BUILD G dock)
    // =====================================================

    let ctrlQueue = Promise.resolve();
    function writeCtrl(s) {
      // serialize all GATT writes - Web Bluetooth allows only one operation in flight
      const job = ctrlQueue.then(() => ctrlChar.writeValue(new TextEncoder().encode(s)));
      ctrlQueue = job.catch(() => {});
      return job;
    }

    // ---- WiFi network scan picker ----
    let wifiScanResults = [];
    let wifiScanTimer = null;

    function wifiBars(rssi) {
      if (rssi >= -55) return '\u2582\u2584\u2586\u2588';
      if (rssi >= -67) return '\u2582\u2584\u2586';
      if (rssi >= -75) return '\u2582\u2584';
      return '\u2582';
    }

    // ---- WiFi fast sync (LAN HTTP transport, key paired over BLE) ----
    function dockIp() { try { return localStorage.getItem('tc_dock_ip') || ''; } catch (e) { return ''; } }
    function dockKey() { try { return localStorage.getItem('tc_wkey') || ''; } catch (e) { return ''; } }
    let wifiSyncOk = false;
    try { wifiSyncOk = localStorage.getItem('tc_wifi_sync') === '1'; } catch (e) {}

    function wifiFastAvailable() {
      return wifiSyncOk && dockIp() && dockKey() && location.protocol !== 'https:';
    }

    function fastSyncNote() {
      const el = document.getElementById('fastSyncStatus');
      if (!el) return;
      if (location.protocol === 'https:')
        el.textContent = 'Blocked from the https app (browser rule). Works when the app is opened locally / from the dock.';
      else if (wifiFastAvailable()) el.textContent = 'Fast sync ready via ' + dockIp() + ':8080';
      else el.textContent = '';
    }

    async function httpSend(path, bytes, onPct) {
      if (onPct) onPct(5);
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 20000);
      try {
        const r = await fetch('http://' + dockIp() + ':8080' + path, {
          method: 'POST',
          headers: { 'X-Auth': dockKey(), 'Content-Type': 'application/octet-stream' },
          body: bytes,
          signal: ctl.signal
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
      } finally { clearTimeout(t); }
      if (onPct) onPct(100);
    }

    window.enableFastSync = async function() {
      const el = document.getElementById('fastSyncStatus');
      if (location.protocol === 'https:') { fastSyncNote(); return; }
      if (!ctrlChar) { el.textContent = 'Connect Bluetooth first.'; return; }
      if (!dockIp()) {
        el.textContent = 'Asking the dock for its IP...';
        try { await writeCtrl('IP'); } catch (e) {}
        for (let i = 0; i < 12 && !dockIp(); i++) await sleep(250);
        if (!dockIp()) { el.textContent = 'Dock is not on WiFi yet - send WiFi details first.'; return; }
      }
      let key = dockKey();
      if (!key) {
        const b = new Uint8Array(16);
        crypto.getRandomValues(b);
        key = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
        try { localStorage.setItem('tc_wkey', key); } catch (e) {}
      }
      try {
        el.textContent = 'Pairing key with dock...';
        const ok = bleWaitFor('OK', 5000);
        await writeCtrl('WKEY ' + key);
        await ok;
        el.textContent = 'Testing LAN connection...';
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 4000);
        const r = await fetch('http://' + dockIp() + ':8080/ping', { signal: ctl.signal });
        clearTimeout(t);
        if (!r.ok) throw new Error('ping ' + r.status);
        wifiSyncOk = true;
        try { localStorage.setItem('tc_wifi_sync', '1'); } catch (e) {}
        fastSyncNote();
        showStatus('Fast WiFi sync enabled!', 'success');
      } catch (e) {
        wifiSyncOk = false;
        el.textContent = 'Could not reach the dock on the LAN (' + e.message + '). Same network? Dock on WiFi?';
      }
    };
    setTimeout(fastSyncNote, 500);

    function hideWifiScan() {
      clearTimeout(wifiScanTimer);
      wifiScanResults = [];
      const el = document.getElementById('wifiScanList');
      if (el) el.innerHTML = '';
      const btn = document.getElementById('wifiScanBtn');
      if (btn) { btn.disabled = false; btn.textContent = 'Scan for networks'; }
    }

    async function dockWifiScan() {
      if (!ctrlChar) { showStatus('Connect Bluetooth first', 'error'); return; }
      const btn = document.getElementById('wifiScanBtn');
      wifiScanResults = [];
      document.getElementById('wifiScanList').innerHTML =
        '<div style="font-size:12px; color:#889; padding:4px 2px;">Scanning...</div>';
      btn.disabled = true;
      btn.textContent = 'Scanning...';
      clearTimeout(wifiScanTimer);
      wifiScanTimer = setTimeout(() => renderWifiScan(true), 12000);
      try { await writeCtrl('SCAN'); }
      catch (e) { showStatus('Scan failed: ' + e.message, 'error'); renderWifiScan(true); }
    }
    window.dockWifiScan = dockWifiScan;

    function renderWifiScan(done) {
      const el = document.getElementById('wifiScanList');
      if (!el) return;
      if (done) {
        clearTimeout(wifiScanTimer);
        const btn = document.getElementById('wifiScanBtn');
        btn.disabled = false;
        btn.textContent = 'Scan again';
      }
      if (!wifiScanResults.length) {
        el.innerHTML = done ? '<div style="font-size:12px; color:#889; padding:4px 2px;">No networks found.</div>' : el.innerHTML;
        return;
      }
      const sel = document.getElementById('wifiSsid').value;
      el.innerHTML = '';
      wifiScanResults.forEach(n => {
        const row = document.createElement('div');
        const isSel = n.ssid === sel;
        row.style.cssText = 'display:flex; align-items:center; gap:8px; padding:7px 8px; margin-bottom:3px;'
          + ' border-radius:8px; cursor:pointer; font-size:13px;'
          + (isSel ? ' background:#3b2a6b; outline:1px solid #8b5cf6;' : ' background:#0f1626;');
        row.innerHTML = `
          <span style="color:#4ade80; font-size:11px; letter-spacing:1px; width:30px;">${wifiBars(n.rssi)}</span>
          <span style="flex:1; color:#fff;">${n.ssid.replace(/</g, '&lt;')}</span>
          ${n.enc ? '<span style="color:#889; font-size:12px;">&#128274;</span>' : '<span style="color:#667; font-size:11px;">open</span>'}`;
        row.onclick = () => {
          document.getElementById('wifiSsid').value = n.ssid;
          hideWifiScan();
          const p = document.getElementById('wifiPass');
          if (n.enc) p.focus();
          else p.value = '';
        };
        el.appendChild(row);
      });
    }

    async function dockWifi() {
      if (!ctrlChar) { showStatus('Connect Bluetooth first', 'error'); return; }
      const ssid = document.getElementById('wifiSsid').value.trim().replace(/\|/g, '');
      const pass = document.getElementById('wifiPass').value.replace(/\|/g, '');
      if (!ssid) { showStatus('Enter a network name', 'error'); return; }
      try {
        await writeCtrl('WIFI ' + ssid + '|' + pass);
        try { localStorage.setItem('tc_wifi', JSON.stringify({ ssid, pass })); } catch (e) {}
        hideWifiScan();
        showStatus('WiFi details sent - dock is trying to connect...', 'info');
      } catch (e) { showStatus('WiFi send failed: ' + e.message, 'error'); }
    }
    window.dockWifi = dockWifi;

    // prefill remembered WiFi details (entered once, reused forever)
    try {
      const savedWifi = JSON.parse(localStorage.getItem('tc_wifi') || 'null');
      if (savedWifi) {
        document.getElementById('wifiSsid').value = savedWifi.ssid || '';
        document.getElementById('wifiPass').value = savedWifi.pass || '';
      }
    } catch (e) {}

    async function dockBtn(n) {
      if (!ctrlChar) { showStatus('Connect Bluetooth first', 'error'); return; }
      try { await writeCtrl('BTN:' + n); } catch (e) { showStatus('Button send failed: ' + e.message, 'error'); }
    }
    window.dockBtn = dockBtn;

    function withTimeout(p, ms, what) {
      return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what + ' timed out')), ms))]);
    }

    let sendInProgress = false;

    async function sendBLE(packed, cardName, beginCmd, onPct) {
      if (sendInProgress) { showStatus('A send is already in progress', 'error'); return; }
      sendInProgress = true;
      try {
        ackBase = 0;
        // BEGIN with auto-wait if the dock is mid-draw
        let began = false;
        for (let attempt = 0; attempt < 3 && !began; attempt++) {
          const resp = bleWaitFor('RDY', 5000).then(() => 'RDY').catch(() => null);
          const busy = bleWaitFor('ERR:busy', 5000).then(() => 'BUSY').catch(() => null);
          await withTimeout(writeCtrl(beginCmd || ('BEGIN ' + packed.length)), 5000, 'BEGIN write');
          const outcome = await Promise.race([resp, busy, sleep(5200).then(() => 'TIMEOUT')]);
          if (outcome === 'RDY') { began = true; break; }
          if (outcome === 'BUSY') {
            showStatus('Dock is drawing - waiting...', 'info');
            try { await bleWaitFor('DONE', 15000); } catch (e) { await sleep(3000); }  // draws take <=10s; retry sooner if DONE was lost
            continue;
          }
          throw new Error('Dock did not respond to BEGIN');
        }
        if (!began) throw new Error('Dock stayed busy - try again shortly');

        const CHUNK = 244, WINDOW = 12288, STALL_MS = 10000;
        const canNR = !!dataChar.writeValueWithoutResponse;
        const t0 = Date.now();

        for (let off = 0; off < packed.length; off += CHUNK) {
          // poll the ack counter - immune to missed notification races
          const stallStart = Date.now();
          while (off - ackBase > WINDOW) {
            await sleep(30);
            if (Date.now() - stallStart > STALL_MS) {
              throw new Error('Dock stopped responding at ' + Math.round(off / packed.length * 100) + '%');
            }
          }
          const slice = packed.slice(off, Math.min(off + CHUNK, packed.length));
          if (canNR) await withTimeout(dataChar.writeValueWithoutResponse(slice), 5000, 'BLE write');
          else await withTimeout(dataChar.writeValue(slice), 5000, 'BLE write');
          if ((off / CHUNK) % 8 === 0) {
            const pct = Math.round(off / packed.length * 100);
            if (onPct) onPct(pct);
            else {
              const elapsed = (Date.now() - t0) / 1000;
              const rate = off / Math.max(0.001, elapsed);
              const eta = rate > 0 ? (packed.length - off) / rate : 0;
              showStatus(`Sending ${cardName}...`, 'info', pct, eta);
            }
          }
        }
        // END handshake with retries: the OK notify can be lost to congestion,
        // and the firmware re-acks a repeated END without double-storing.
        let endAcked = false;
        for (let t = 0; t < 3 && !endAcked; t++) {
          const ok = bleWaitFor('OK', 4000);
          await withTimeout(writeCtrl('END'), 5000, 'END write');
          try { await ok; endAcked = true; } catch (e) {}
        }
        if (!endAcked) throw new Error('Dock did not confirm the transfer');
        // Only sends that trigger a draw wait for DONE. For store-only transfers
        // (THM / IMB / IMG show=0) the OK above IS completion - their DONE fires
        // ~15ms after OK and occasionally gets lost to notify congestion, which
        // used to hang this wait forever.
        const drawsNow = !beginCmd || /^(IMG|IMB) .+ 1$/.test(beginCmd);
        if (onPct) onPct(100);
        else if (drawsNow) showStatus(`${cardName} sent - dock is drawing...`, 'info', 100);
        if (drawsNow) {
          await bleWaitFor('DONE', 60000);
          if (!onPct) {
            const totalSec = ((Date.now() - t0) / 1000).toFixed(1);
            showStatus(`${cardName} displayed! (${totalSec}s transfer)`, 'success', 100);
          }
        } else {
          await sleep(150);  // let the dock's store loop clear before the next transfer
        }
      } finally {
        sendInProgress = false;
      }
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function dockId(card) { return (card.id || '').replace(/-/g, '').slice(0, 8) || 'xxxxxxxx'; }

    function makeThumbBytes(imgLike) {
      const c = document.createElement('canvas'); c.width = 56; c.height = 78;
      const x = c.getContext('2d');
      x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
      x.fillStyle = '#000'; x.fillRect(0, 0, 56, 78);
      x.drawImage(imgLike, 0, 0, 56, 78);
      const d = x.getImageData(0, 0, 56, 78);
      const out = new Uint8Array(56 * 78 * 2);
      for (let i = 0; i < 56 * 78; i++) {
        const v = ((d.data[i*4] & 0xF8) << 8) | ((d.data[i*4+1] & 0xFC) << 3) | (d.data[i*4+2] >> 3);
        out[i*2] = v & 0xFF;          // little-endian for the ESP
        out[i*2+1] = (v >> 8) & 0xFF;
      }
      return out;
    }

    async function loadCardImage(imageUrl) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = () => reject(new Error('Image load failed')); img.src = imageUrl; });
      return img;
    }

    // serialize all card transfers: overlapping BLE flows interleave and stall
    let sendChain = Promise.resolve();
    let chainDepth = 0;
    function enqueueSend(fn) {
      if (chainDepth > 0) showStatus('Waiting for the current transfer to finish...', 'info');
      chainDepth++;
      const run = async () => { try { return await fn(); } finally { chainDepth--; } };
      const p = sendChain.then(run, run);
      sendChain = p.catch(() => {});
      return p;
    }

    async function sendCard(imageUrl, cardName) {
      return enqueueSend(() => sendCardInner(imageUrl, cardName));
    }
    async function sendCardInner(imageUrl, cardName) {
      if (!ctrlChar || !dataChar) { showStatus('Connect Bluetooth first', 'error'); return; }
      try {
        showStatus(`Loading ${cardName}...`, 'info', 0);
        const img = await loadCardImage(imageUrl);
        showStatus(`Processing ${cardName}...`, 'info', 0);
        const packed = processImageNew(portraitSource(img));
        if (packed.length !== IMAGE_PACKED_SIZE) { showStatus(`Pack error: ${packed.length} != ${IMAGE_PACKED_SIZE}`, 'error'); return; }
        // live sends only need the render the active panel will draw - ask the dock
        let dockPanel = 'A';
        try {
          const pw = bleWaitFor('P:', 3000);
          await writeCtrl('PANEL');
          dockPanel = (await pw) === 'P:B' ? 'B' : 'A';
        } catch (e) {}  // older firmware: assume A, send the full render
        if (dockPanel === 'B') {
          await sendBLE(packed.packedB, cardName, 'IMB ' + packed.packedB.length + ' - 1');
        } else {
          await sendBLE(packed, cardName, 'IMG ' + packed.length + ' - 1');
        }
      } catch (error) {
        showStatus('Error: ' + error.message, 'error');
      }
    }

    // thumbnail URL cache so the Dock tab can show images for saved cards
    let dockThumbCache = {};
    try { dockThumbCache = JSON.parse(localStorage.getItem('tc_dock_thumbs') || '{}'); } catch (e) {}
    function cacheDockThumb(id, url) {
      if (!url) return;
      dockThumbCache[id] = url;
      try { localStorage.setItem('tc_dock_thumbs', JSON.stringify(dockThumbCache)); } catch (e) {}
    }

    // core save used by Dock+ buttons and deck import
    async function dockSaveCore(card, imageUrl, thumbUrl, label, onPct, fav = 1) {
      return enqueueSend(() => dockSaveCoreInner(card, imageUrl, thumbUrl, label, onPct, fav));
    }
    async function dockSaveCoreInner(card, imageUrl, thumbUrl, label, onPct, fav = 1) {
      const id = dockId(card);
      const disp = label || card.name;
      const pt = (card.power && card.toughness) ? (card.power + '/' + card.toughness) : '';
      const img = await loadCardImage(imageUrl);
      const packed = processImageNew(portraitSource(img));
      const thumb = makeThumbBytes(portraitSource(img));
      let viaWifi = false;
      if (wifiFastAvailable()) {
        // 1.5s liveness probe first: a stale fast-sync flag (dock off WiFi) must not
        // cost a 20s fetch timeout on the first save after a page refresh
        let alive = false;
        try {
          const ctl = new AbortController();
          const t = setTimeout(() => ctl.abort(), 1500);
          const r = await fetch('http://' + dockIp() + ':8080/ping', { signal: ctl.signal });
          clearTimeout(t);
          alive = r.ok;
        } catch (e) {}
        if (!alive) {
          console.warn('Fast sync flagged but dock not reachable - using BLE');
          wifiSyncOk = false;
          try { localStorage.setItem('tc_wifi_sync', '0'); } catch (e) {}
          fastSyncNote();
        } else try {
          await httpSend('/cardb?id=' + id, packed.packedB, onPct);
          await httpSend('/card?id=' + id + '&show=0', packed, onPct);
          await httpSend('/thm?id=' + id, thumb);
          viaWifi = true;
        } catch (e) {
          console.warn('WiFi sync failed, falling back to BLE:', e);
          wifiSyncOk = false;
          try { localStorage.setItem('tc_wifi_sync', '0'); } catch (e) {}
          fastSyncNote();
        }
      }
      if (!viaWifi) {
        await sendBLE(packed.packedB, disp, 'IMB ' + packed.packedB.length + ' ' + id, onPct ? (() => {}) : undefined);
        await sendBLE(packed, disp, 'IMG ' + packed.length + ' ' + id + ' 0', onPct);
        await sendBLE(thumb, disp, 'THM ' + thumb.length + ' ' + id, onPct ? (() => {}) : undefined);
      }
      const typeLine = ((card.type_line || (card.card_faces && card.card_faces[0].type_line) || ''))
                        .replace(/\|/g, '/').slice(0, 23);
      const metaOk = bleWaitFor('OK', 5000);
      await writeCtrl('META ' + id + '|' + card.name.replace(/\|/g, ' ') + '|' + pt
                      + '|' + typeLine + '|' + (card.id || '') + '|' + (fav ? 1 : 0));
      await metaOk;
      cacheDockThumb(id, thumbUrl || imageUrl);
      return id;
    }

    // Save a card into the dock's onboard favourites (image + thumbnail + meta)
    window.saveCardToDock = async function(card, imageUrl) {
      if (!ctrlChar || !dataChar) { showStatus('Connect Bluetooth first', 'error'); return; }
      try {
        showStatus(`Saving ${card.name} to dock...`, 'info', 0);
        await dockSaveCore(card, imageUrl, card.image_small || (card.image_uris && card.image_uris.small));
        showStatus(`${card.name} saved to dock!`, 'success', 100);
      } catch (error) {
        showStatus('Save failed: ' + error.message, 'error');
      }
    };

    // =====================================================
    // STATUS
    // =====================================================

    function showStatus(message, type, progress = 0, timeRemaining = null) {
      let extra = '';
      if (timeRemaining !== null && timeRemaining > 0) {
        extra = `<div class="status-time">${Math.ceil(timeRemaining)}s remaining</div>`;
      }
      statusEl.innerHTML = `<div class="status ${type}" style="--progress-width: ${progress}%"><div>${message}${extra}</div></div>`;
      if (type === 'success' || type === 'error') {
        setTimeout(() => { if (statusEl.querySelector(`.${type}`)) statusEl.innerHTML = ''; }, 5000);
      }
    }

    // =====================================================
    // DECK IMPORT -> TOKEN DETECTION -> DOCK
    // =====================================================
    const DECK_PROXY = 'https://tokenconjurer.shippyuk.workers.dev';

    let importGroups = [];       // one per functional token (oracle_id)
    let importCommanders = [];   // [{name, chosen, prints, printsLoaded, expanded}]
    let importDeckName = 'Imported deck';

    function impStatus(t) { document.getElementById('importStatus').textContent = t; }
    function tokenUris(t) { return t.image_uris || (t.card_faces && t.card_faces[0].image_uris) || {}; }

    async function fetchViaProxy(param, id) {
      if (!DECK_PROXY) throw new Error('URL import needs the relay set up - paste the decklist instead');
      const r = await fetch(DECK_PROXY + '?' + param + '=' + id);
      if (!r.ok) throw new Error('Deck fetch failed (' + r.status + ')' + (param === 'mox' && r.status === 403 ? ' - Moxfield blocked the relay; paste the list instead' : ''));
      return r.json();
    }

    async function fetchArchidekt(url) {
      const m = url.match(/archidekt\.com\/decks\/(\d+)/);
      if (!m) return null;
      const j = await fetchViaProxy('deck', m[1]);
      importDeckName = (j.name || 'Imported deck').slice(0, 38);
      const names = [], commanders = [];
      (j.cards || []).forEach(c => {
        const n = c.card && c.card.oracleCard && c.card.oracleCard.name;
        if (!n) return;
        if (!names.includes(n)) names.push(n);
        const cats = c.categories || [];
        if (cats.some(x => /commander/i.test(x)) && !commanders.includes(n)) commanders.push(n);
      });
      return { names, commanders };
    }

    async function fetchMoxfield(url) {
      const m = url.match(/moxfield\.com\/decks\/([A-Za-z0-9_-]+)/);
      if (!m) return null;
      const j = await fetchViaProxy('mox', m[1]);
      importDeckName = (j.name || 'Imported deck').slice(0, 38);
      const names = [], commanders = [];
      const collect = (board, isCmd) => {
        const cards = (j.boards && j.boards[board] && j.boards[board].cards) || {};
        Object.values(cards).forEach(c => {
          const n = c.card && c.card.name;
          if (!n) return;
          if (!names.includes(n)) names.push(n);
          if (isCmd && !commanders.includes(n)) commanders.push(n);
        });
      };
      collect('commanders', true);
      collect('mainboard', false);
      collect('companions', false);
      return { names, commanders };
    }

    function parseDecklist(text) {
      const names = [], commanders = [];
      let section = '';
      text.split('\n').forEach(line => {
        line = line.trim();
        if (!line) { section = ''; return; }
        if (line.startsWith('//') || line.startsWith('#')) return;
        if (!/^\d/.test(line) && /^(commander|commanders|sideboard|maybeboard|deck|mainboard|companion)s?\b/i.test(line)) {
          section = line.toLowerCase();
          return;
        }
        const m = line.match(/^(?:\d+x?\s+)?(.+?)(?:\s+\([A-Z0-9]{3,5}\).*)?$/);
        if (m && m[1]) {
          if (!names.includes(m[1])) names.push(m[1]);
          if (/^commander/.test(section) && !commanders.includes(m[1])) commanders.push(m[1]);
        }
      });
      return { names, commanders };
    }

    function isWantedPart(p) {
      if (p.component === 'token') return true;
      if (/emblem/i.test(p.type_line || '')) return true;
      if (p.name === 'The Monarch' || p.name === "City's Blessing") return true;
      return false;
    }

    async function importDeck() {
      const url = document.getElementById('importUrl').value.trim();
      const text = document.getElementById('importText').value.trim();
      document.getElementById('importResults').innerHTML = '';
      importGroups = [];
      importCommanders = [];
      try {
        let deck = null;
        if (url) {
          impStatus('Fetching deck...');
          deck = await fetchArchidekt(url) || await fetchMoxfield(url);
          if (!deck) { impStatus('Not an Archidekt or Moxfield deck URL.'); return; }
        } else if (text) {
          importDeckName = 'Imported deck';
          deck = parseDecklist(text);
        } else { impStatus('Give me a URL or a decklist.'); return; }

        if (!deck.names.length) { impStatus('No cards found.'); return; }
        impStatus('Resolving ' + deck.names.length + ' cards via Scryfall...');

        const partIds = {};
        const byName = {};
        for (let i = 0; i < deck.names.length; i += 75) {
          const batch = deck.names.slice(i, i + 75).map(n => ({ name: n }));
          const r = await fetch('https://api.scryfall.com/cards/collection', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifiers: batch })
          });
          const j = await r.json();
          (j.data || []).forEach(card => {
            byName[card.name] = card;
            (card.all_parts || []).forEach(part => {
              if (isWantedPart(part) && part.id !== card.id) partIds[part.id] = true;
            });
          });
          impStatus('Resolving cards... ' + Math.min(i + 75, deck.names.length) + '/' + deck.names.length);
        }

        // commanders: default chosen = the resolved card
        deck.commanders.forEach(n => {
          const card = byName[n] || Object.values(byName).find(c => c.name.startsWith(n));
          if (card) importCommanders.push({ name: card.name, chosen: card, prints: [], printsLoaded: false, expanded: false });
        });

        const ids = Object.keys(partIds);
        if (!ids.length && !importCommanders.length) { impStatus('No tokens or emblems found in this deck.'); return; }
        impStatus('Fetching ' + ids.length + ' token cards...');

        const fetched = [];
        for (let i = 0; i < ids.length; i += 75) {
          const batch = ids.slice(i, i + 75).map(id => ({ id }));
          const r = await fetch('https://api.scryfall.com/cards/collection', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifiers: batch })
          });
          const j = await r.json();
          (j.data || []).forEach(t => fetched.push(t));
        }

        // group by oracle_id: same functional token collapses, different abilities stay apart
        const groups = {};
        fetched.forEach(t => {
          const key = t.oracle_id || t.id;
          if (!groups[key]) {
            groups[key] = { oracleId: key, name: t.name,
                            type: t.type_line || '', pt: (t.power && t.toughness) ? t.power + '/' + t.toughness : '',
                            text: (t.oracle_text || (t.card_faces && t.card_faces[0].oracle_text) || ''),
                            kw: (t.keywords || []).join(', '),
                            chosen: t, prints: [t], printsLoaded: false, expanded: false, checked: true };
          } else if (!groups[key].prints.some(p => p.id === t.id)) {
            groups[key].prints.push(t);
          }
        });
        importGroups = Object.values(groups);

        renderImportResults();
        impStatus(importGroups.length + ' distinct tokens/emblems found. Pick art where you care.');
      } catch (e) {
        impStatus('Import failed: ' + e.message);
      }
    }
    window.importDeck = importDeck;

    async function loadPrints(entry) {
      if (entry.printsLoaded) return;
      const q = 'oracleid:' + entry.oracleId;
      const r = await fetch('https://api.scryfall.com/cards/search?q=' + encodeURIComponent(q)
                            + '&unique=prints&include_extras=true&include_variations=true');
      if (r.ok) {
        const j = await r.json();
        if (j.data && j.data.length) entry.prints = j.data;
      }
      entry.printsLoaded = true;
    }

    async function loadCommanderPrints(entry) {
      if (entry.printsLoaded) return;
      const q = '!"' + entry.name + '"';
      const r = await fetch('https://api.scryfall.com/cards/search?q=' + encodeURIComponent(q) + '&unique=prints');
      if (r.ok) {
        const j = await r.json();
        if (j.data && j.data.length) entry.prints = j.data;
      }
      entry.printsLoaded = true;
    }

    function printsRow(list, entry, pickFn) {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex; gap:8px; overflow-x:auto; padding:8px 0 8px 24px;';
      list.forEach(p => {
        const uris = tokenUris(p);
        if (!uris.small) return;
        const im = document.createElement('img');
        im.src = uris.small;
        im.style.cssText = 'width:96px; border-radius:6px; cursor:pointer;'
          + (p.id === entry.chosen.id ? ' outline:3px solid #8b5cf6;' : ' opacity:.7;');
        im.onclick = () => { entry.chosen = p; entry.expanded = false; renderImportResults(); };
        wrap.appendChild(im);
      });
      return wrap;
    }

    function resetImport() {
      document.getElementById('importInputs').style.display = '';
      document.getElementById('importResults').innerHTML = '';
      document.getElementById('importStatus').textContent = '';
      importGroups = [];
      importCommanders = [];
    }
    window.resetImport = resetImport;

    function renderImportResults() {
      const el = document.getElementById('importResults');
      el.innerHTML = '';
      document.getElementById('importInputs').style.display = 'none';
      const back = document.createElement('div');
      back.innerHTML = `<button class="deck-add-btn" onclick="resetImport()" style="margin-bottom:6px;">&larr; New import</button>
        <span style="font-size:13px; color:#eee; margin-left:8px;">${importDeckName}</span>`;
      el.appendChild(back);

      if (importCommanders.length) {
        const hd = document.createElement('div');
        hd.style.cssText = 'font-size:12px; color:#8b5cf6; margin:8px 0 2px;';
        hd.textContent = 'DECK FACE (commander art shown on the dock)';
        el.appendChild(hd);
        importCommanders.forEach((c, i) => {
          const uris = tokenUris(c.chosen);
          const row = document.createElement('div');
          row.style.cssText = 'display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #223;';
          row.innerHTML = `
            ${uris.small ? `<img src="${uris.small}" style="width:32px; border-radius:3px;">` : ''}
            <div style="flex:1; font-size:13px;">${c.name}</div>
            <button class="deck-add-btn" onclick="toggleCmdArt(${i})">${c.expanded ? 'Close' : 'Art'}</button>`;
          el.appendChild(row);
          if (c.expanded) el.appendChild(printsRow(c.prints, c, null));
        });
      }

      if (importGroups.length) {
        const hd = document.createElement('div');
        hd.style.cssText = 'font-size:12px; color:#8b5cf6; margin:10px 0 2px;';
        hd.textContent = 'TOKENS & EMBLEMS';
        el.appendChild(hd);
      }
      importGroups.forEach((g, i) => {
        const uris = tokenUris(g.chosen);
        const snippet = g.text ? g.text.replace(/\n/g, ' ').slice(0, 52) : '';
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #223;';
        row.innerHTML = `
          <input type="checkbox" id="imp-${i}" ${g.checked ? 'checked' : ''} onchange="importGroups[${i}].checked=this.checked">
          ${uris.small ? `<img src="${uris.small}" style="width:32px; border-radius:3px;" onclick="zoomCard('${uris.normal || uris.small}')">` : ''}
          <div style="flex:1; font-size:13px;">
            ${g.name}${g.pt ? ' <span style="color:#889">(' + g.pt + ')</span>' : ''}
            ${g.kw ? `<div style="font-size:11px; color:#a78bfa;">${g.kw}</div>` : ''}
            ${snippet ? `<div style="font-size:11px; color:#667;">${snippet}</div>` : ''}
          </div>
          <button class="deck-add-btn" onclick="importAddToDeck(${i})" title="Add to app deck">+D</button>
          <button class="deck-add-btn" onclick="toggleTokenArt(${i})">${g.expanded ? 'Close' : (g.prints.length > 1 || !g.printsLoaded ? 'Art' : '')}</button>`;
        el.appendChild(row);
        if (g.expanded) el.appendChild(printsRow(g.prints, g, null));
      });

      const nameRow = document.createElement('div');
      nameRow.style.cssText = 'margin-top:10px;';
      nameRow.innerHTML = `
        <input type="text" id="importDeckName" value="${importDeckName.replace(/"/g, '')}" style="width:100%; padding:8px; border-radius:8px; border:1px solid #333; background:#0f1626; color:#fff; font-size:13px; margin-bottom:6px;">
        <button class="send-btn" style="width:100%;" id="syncBtn" onclick="sendImportToDock()">Send deck to dock</button>
        <div id="syncBox" style="display:none; margin-top:8px;">
          <div style="background:#0f1626; border-radius:8px; height:12px; overflow:hidden;">
            <div id="syncBar" style="height:100%; width:0%; background:#8b5cf6; transition:width .2s;"></div>
          </div>
          <div id="syncText" style="font-size:12px; color:#9fe1cb; margin-top:4px;"></div>
        </div>`;
      el.appendChild(nameRow);
    }

    window.importAddToDeck = function(i) {
      openDeckPicker(importGroups[i].chosen);
    };

    window.toggleTokenArt = async function(i) {
      const g = importGroups[i];
      if (!g.expanded) { impStatus('Loading printings...'); await loadPrints(g); impStatus(''); }
      g.expanded = !g.expanded;
      renderImportResults();
    };

    window.toggleCmdArt = async function(i) {
      const c = importCommanders[i];
      if (!c.expanded) { impStatus('Loading printings...'); await loadCommanderPrints(c); impStatus(''); }
      c.expanded = !c.expanded;
      renderImportResults();
    };

    // mirror the imported token deck into the app's own decks
    function mirrorImportToAppDeck(deckName, chosenGroups) {
      let d = decks.find(x => x.name === deckName);
      if (!d) { d = { name: deckName, cards: [] }; decks.push(d); }
      chosenGroups.forEach(g => {
        const s = cardToStorable(g.chosen);
        if (!d.cards.some(c => c.id === s.id)) d.cards.push(s);
      });
      saveDecks();
      renderDecks();
    }

    window.sendImportToDock = async function() {
      if (!ctrlChar || !dataChar) { impStatus('Connect Bluetooth first.'); return; }
      const chosen = importGroups.filter(g => g.checked);
      if (!chosen.length && !importCommanders.length) { impStatus('Nothing selected.'); return; }
      const deckName = (document.getElementById('importDeckName').value.trim() || 'Imported deck')
                        .replace(/[|,]/g, ' ').slice(0, 38);
      const savedIds = [];
      const failed = [];
      const syncBtn = document.getElementById('syncBtn');
      const syncBox = document.getElementById('syncBox');
      const syncBar = document.getElementById('syncBar');
      const syncText = document.getElementById('syncText');
      syncBtn.disabled = true;
      syncBox.style.display = '';
      impStatus('');
      const setSync = (i, name, pct, extra) => {
        const overall = Math.round(((i + pct / 100) / chosen.length) * 100);
        syncBar.style.width = overall + '%';
        syncText.textContent = (i + 1) + ' of ' + chosen.length + ': ' + name + (extra ? ' ' + extra : '');
      };

      for (let i = 0; i < chosen.length; i++) {
        const t = chosen[i].chosen;
        const uris = tokenUris(t);
        if (!uris.png && !uris.large) { failed.push(t.name + ' (no image)'); continue; }
        let done = false;
        for (let attempt = 1; attempt <= 2 && !done; attempt++) {
          try {
            setSync(i, t.name, 0, attempt > 1 ? '(retry)' : '');
            const id = await dockSaveCore(t, uris.png || uris.large, uris.small, t.name,
                                          pct => setSync(i, t.name, pct, attempt > 1 ? '(retry)' : ''), 0);
            savedIds.push(id);
            done = true;
          } catch (e) {
            console.warn('Token save failed', t.name, 'attempt', attempt, e);
            setSync(i, t.name, 0, 'failed' + (attempt === 1 ? ', retrying...' : ''));
            await sleep(1200);
          }
        }
        if (!done) failed.push(t.name);
        await sleep(250);
      }

      try {
        let thumbId = '-';
        if (importCommanders.length) {
          const cmd = importCommanders[0];
          const uris = tokenUris(cmd.chosen);
          if (uris.png || uris.large) {
            syncText.textContent = 'Sending deck face art...';
            const cimg = await loadCardImage(uris.png || uris.large);
            const cthumb = makeThumbBytes(portraitSource(cimg));
            thumbId = dockId(cmd.chosen);
            await sendBLE(cthumb, cmd.name + ' (deck face)', 'THM ' + cthumb.length + ' ' + thumbId, () => {});
            cacheDockThumb(thumbId, uris.small);
          }
        }

        syncText.textContent = 'Registering deck on dock...';
        const ok = bleWaitFor('OK', 5000);
        await writeCtrl('DECK ' + deckName + '|' + thumbId + '|' + savedIds.join(','));
        await ok;
        mirrorImportToAppDeck(deckName, chosen);
        syncBar.style.width = '100%';
        let msg = 'Done - "' + deckName + '" (' + savedIds.length + ' tokens) is on the dock.';
        if (failed.length) msg += ' Failed: ' + failed.join(', ') + ' (tap send again to retry).';
        syncText.textContent = msg;
      } catch (e) {
        syncText.textContent = 'Deck registration failed: ' + e.message + ' - tokens saved: ' + savedIds.length;
      }
      document.getElementById('syncBtn').disabled = false;
    };

    // =====================================================
    // DOCK TAB - cards stored on the dock itself
    // =====================================================
    let dockCards = [];

    async function refreshDockList() {
      const el = document.getElementById('dockList');
      if (!ctrlChar) {
        el.innerHTML = '<div class="empty-state"><div class="empty-state-text">Connect Bluetooth first,<br>then reopen this tab.</div></div>';
        return;
      }
      dockCards = [];
      dockDecks = [];
      el.innerHTML = '<div class="loading"><div class="spinner"></div><div>Reading dock...</div></div>';
      try {
        await writeCtrl('DECKS');
        await bleWaitFor('D:END', 5000).catch(() => {});
        await writeCtrl('LIST');
      } catch (e) { el.innerHTML = '<div class="empty-state"><div class="empty-state-text">Could not read dock.</div></div>'; }
    }

    let dockDecks = [];

    function renderDockList() {
      const el = document.getElementById('dockList');
      const count = document.getElementById('dockCount');
      if (count) count.textContent = dockCards.length ? dockCards.length : '';
      el.innerHTML = '';
      if (dockDecks.length) {
        const hd = document.createElement('div');
        hd.style.cssText = 'font-size:12px; color:#8b5cf6; margin:4px 0;';
        hd.textContent = 'DECKS ON DOCK';
        el.appendChild(hd);
        dockDecks.forEach(d => {
          const div = document.createElement('div');
          div.className = 'card-item';
          div.innerHTML = `
            <div class="card-main"><div class="card-info">
              <div class="card-name">${d.name}</div>
              <div class="card-set">${d.count} tokens</div>
            </div></div>
            <div class="card-actions">
              <button class="deck-add-btn" onclick="dockDeckDelete('${d.name.replace(/'/g, "\\'")}')">Remove deck</button>
            </div>`;
          el.appendChild(div);
        });
      }
      if (dockCards.length === 0 && dockDecks.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="empty-state-text">Nothing saved on the dock yet.<br>Use Dock+ on any card, or import a deck.</div></div>';
        return;
      }
      if (dockCards.length) {
        const hd = document.createElement('div');
        hd.style.cssText = 'font-size:12px; color:#8b5cf6; margin:10px 0 4px;';
        hd.textContent = 'CARDS ON DOCK (' + dockCards.length + '/40)';
        el.appendChild(hd);
      }
      dockCards.forEach(c => {
        const thumbUrl = dockThumbCache[c.id]
          || (c.sid ? 'https://api.scryfall.com/cards/' + c.sid + '?format=image&version=small' : null);
        const div = document.createElement('div');
        div.className = 'card-item';
        div.innerHTML = `
          <div class="card-main">
            ${thumbUrl ? `<img class="card-thumb" src="${thumbUrl}" onclick="zoomCard(this.src)">`
                       : `<div class="card-thumb" style="background:#233; display:flex; align-items:center; justify-content:center; color:#567; font-size:10px;">no img</div>`}
            <div class="card-info">
              <div class="card-name">${c.fav ? '&#9733; ' : ''}${c.name}</div>
              <div class="card-set">${c.type ? c.type + (c.pt ? ' &middot; ' : '') : ''}${c.pt ? 'P/T ' + c.pt : ''}</div>
            </div>
          </div>
          <div class="card-actions">
            <button class="send-btn" onclick="dockShow('${c.id}')">Show on Card</button>
            <button class="deck-add-btn" onclick="dockAddToDeck('${c.id}')" title="Add to app deck">+D</button>
            <button class="deck-add-btn" onclick="dockDelete('${c.id}')" title="Remove from dock">Remove</button>
          </div>`;
        el.appendChild(div);
      });
    }

    window.dockDeckDelete = async function(name) {
      if (!ctrlChar) return;
      try {
        const ok = bleWaitFor('OK', 5000);
        await writeCtrl('DECKDEL ' + name);
        await ok;
        refreshDockList();
      } catch (e) { showStatus('Remove failed: ' + e.message, 'error'); }
    };

    window.dockAddToDeck = async function(id) {
      const c = dockCards.find(x => x.id === id);
      if (!c || !c.sid) { showStatus('No card data for this entry', 'error'); return; }
      try {
        const r = await fetch('https://api.scryfall.com/cards/' + c.sid);
        if (!r.ok) throw new Error('lookup failed');
        openDeckPicker(await r.json());
      } catch (e) { showStatus('Could not fetch card: ' + e.message, 'error'); }
    };

    window.dockShow = async function(id) {
      if (!ctrlChar) return;
      try {
        showStatus('Writing to card...', 'info');
        const done = bleWaitFor('DONE', 60000);
        await writeCtrl('SHOW ' + id);
        await done;
        showStatus('Card displayed!', 'success');
      } catch (e) { showStatus('Show failed: ' + e.message, 'error'); }
    };

    window.dockDelete = async function(id) {
      if (!ctrlChar) return;
      try {
        const ok = bleWaitFor('OK', 5000);
        await writeCtrl('DEL ' + id);
        await ok;
        refreshDockList();
      } catch (e) { showStatus('Remove failed: ' + e.message, 'error'); }
    };

    // Display settings wiring
    (function initDispSettings() {
      const bind = (id, key, isFloat) => {
        const el = document.getElementById(id);
        const lbl = document.getElementById(id + 'V');
        if (!el) return;
        el.value = dispSettings[key];
        if (lbl) lbl.textContent = dispSettings[key];
        el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
          dispSettings[key] = isFloat ? parseFloat(el.value) : el.value;
          if (lbl) lbl.textContent = el.value;
          saveDispSettings();
        });
      };
      bind('dsMode', 'mode', false);
      bind('dsBtrim', 'btrim', true);
      bind('dsStrim', 'strim', true);
      bind('dsTtrim', 'ttrim', true);
      bind('dsGamma', 'gamma', true);
      bind('dsBright', 'bright', true);
      bind('dsContrast', 'contrast', true);
      bind('dsDither', 'dither', false);
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
  </script>
</body>
